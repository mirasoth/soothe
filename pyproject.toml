[project]
name = "soothe-workspace"
version = "0.0.0"
description = "Soothe monorepo workspace (meta-package, no dependencies)"
# Cap below 3.14: uv universal resolution hits an unsatisfiable soothe-nano split on
# python_full_version==3.14.* + win32; CI matrix is 3.12/3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
    "soothe-sdk",
    "soothe-nano",
    "soothe-client-python",
    "soothe-cli",
    "soothe",
    "soothe-daemon",
]

[tool.uv.workspace]
members = ["packages/*", "client/python"]

# cryptography 49.0 dropped macOS x86_64/universal2 wheels (arm64-only). Cap below
# 49 so Intel Macs install a wheel instead of compiling the Rust sdist.
[tool.uv]
constraint-dependencies = ["cryptography>=41.0,<49"]

# Pin the default package index to PyPI so `uv sync` / `make all-sync` work even when the
# environment sets UV_INDEX_URL or UV_DEFAULT_INDEX to a broken or unreachable mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
soothe-sdk = { workspace = true }
# soothe-nano is a PyPI dependency (not a workspace member / submodule).
soothe-client-python = { workspace = true }
soothe-cli = { workspace = true }
soothe = { workspace = true }
soothe-daemon = { workspace = true }

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=9.0.2",
    "pytest-xdist>=3.6.1",  # Parallel test execution (verify_finally uses -n auto per package)
    "textual-dev>=1.8.0",
    "langfuse>=3.0.0,<4.0.0",
    "pyinstaller>=6.20.0",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
# Use importlib import mode to handle duplicate module names in monorepo
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"

# Ruff config for root-level directories (examples/, scripts/)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
per-file-ignores = { "examples/**/*.py" = ["N999", "E402"] }

[tool.ruff.format]
docstring-code-format = true

# Dead-code analysis (make vulture, verify_finally)
[tool.vulture]
paths = [
    "packages/soothe/src",
    "packages/soothe-daemon/src",
    "packages/soothe-cli/src",
    "scripts/vulture_whitelist.py",
]
exclude = ["*/.backups/*", "*/tests/*", "*/__pycache__/*"]
min_confidence = 90
ignore_names = [
    "exc_tb",
    "exc_val",
    "exc_type",
    "__getattr__",
    "__aenter__",
    "__aexit__",
    "__enter__",
    "__exit__",
]
ignore_decorators = [
    "@app.command",
    "@app.callback",
    "@pytest.fixture",
    "@field_validator",
    "@model_validator",
    "@computed_field",
    "@validator",
    "@root_validator",
]
