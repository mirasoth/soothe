# Soothe nano.yml — production agent config
# PostgreSQL persistence + pgvector + OpenAI-compatible provider.
# Aligned with config/develop/nano.yml production router roles
# (single OpenAI-compatible provider; no local omlx / agnes).
#
# Mounted at /var/lib/soothe/config/nano.yml (default agent path).
# Uses environment variable substitution (${ENV_VAR}).
#
# Required env vars (set in deploy/.env):
#   OPENAI_API_KEY        - OpenAI-compatible provider credential
#   OPENAI_BASE_URL       - OpenAI-compatible API base URL

# =============================================================================
# LLM Providers
# =============================================================================
providers:
  - name: openai-custom
    provider_type: openai
    api_base_url: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    models:
      - glm-5.2                  # Default / think
      - qwen3.6-flash            # Fast role
      - qwen3.7-plus             # Image / multimodal
      - text-embedding-v4

# =============================================================================
# Model Router
# =============================================================================
router_profiles:
  - name: production
    router:
      default: "openai-custom:glm-5.2"
      fast: "openai-custom:qwen3.6-flash"
      think: "openai-custom:glm-5.2"
      image: "openai-custom:qwen3.7-plus"
      ocr: null

active_router_profile: production

embedding_profile:
  - model_role: openai-custom:text-embedding-v4
    embedding_dims: 1536

# =============================================================================
# Persistence Backend
# =============================================================================
persistence:
  default_backend: postgresql
  postgres_base_dsn: "postgresql://postgres:postgres@soothe-pgvector:5432"
  postgres:
    pool_max_idle_seconds: 90
    pool_max_lifetime_seconds: 900

# =============================================================================
# Vector Stores
# =============================================================================
vector_stores:
  - name: pgvector
    provider_type: pgvector
    dsn: "postgresql://postgres:postgres@soothe-pgvector:5432/soothe_vectors"
    pool_size: 8  # Headroom for concurrent skillify retrievers + checkpointer/sloop.

vector_store_router:
  default: "pgvector:soothe_default"

# =============================================================================
# Workspace Configuration
# =============================================================================
# Maps host paths to container paths so daemon can access client workspaces.
# docker-compose defaults the bind mount to $HOME; override SOOTHE_WORKSPACE_HOST_ROOT if needed.
workspace_mount:
  host_root: ${SOOTHE_WORKSPACE_HOST_ROOT}
  container_root: /var/lib/soothe/workspaces

# =============================================================================
# Security Configuration
# =============================================================================
security:
  allow_paths_outside_workspace: true
  require_approval_for_outside_paths: false
  allowed_paths:
    - "**"
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
