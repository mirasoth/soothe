# Docker Compose for Soothe Production Deployment
# Self-contained production stack: PostgreSQL + pgvector + Soothe daemon
#
# Usage (from deploy/ directory):
#   docker compose up -d                    # Start production stack
#   docker compose down                     # Stop stack
#   docker compose ps                       # Show status
#
# Required environment variables (set in deploy/.env):
#   OPENAI_API_KEY=...                      # OpenAI-compatible provider key
#   OPENAI_BASE_URL=...                     # OpenAI-compatible API base URL
# Optional:
#   TAVILY_API_KEY=...                      # Tavily web search (deep_research / wizsearch)
#   SOOTHE_WORKSPACE_HOST_ROOT=...          # Host workspace directory (default: $HOME)
# Host persistence (bind mounts into /var/lib/soothe):
#   $HOME/.soothe-prod  → daemon workdir (data, logs, pid, config base)
#   $SOOTHE_WORKSPACE_HOST_ROOT (default $HOME) → client workspaces
# ~/.soothe-prod is isolated from dev's ~/.soothe so prod state survives
# `make reset-the-world` and vice-versa.
# Pre-create ~/.soothe-prod/{data,logs,config} before `compose up`
# (make docker-prod-up does this). Colima/Lima sshfs rejects Docker's
# create+chown of missing bind-mount sources ("chown ... permission denied").

services:
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - soothe-db
    expose:
      - "5432"
    volumes:
      - soothe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  soothed:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/soothed:latest
    restart: unless-stopped
    depends_on:
      soothe-pgvector:
        condition: service_healthy
    networks:
      - soothe-db
      - soothe-app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SOOTHE_WORKSPACE_HOST_ROOT: ${SOOTHE_WORKSPACE_HOST_ROOT:-${HOME}}
      SOOTHE_DAEMON_SOOTHE_CONFIG_PATH: /var/lib/soothe/config/nano.yml
      SOOTHE_POSTGRES_BASE_DSN: postgresql://postgres:postgres@soothe-pgvector:5432
      SOOTHE_POSTGRES_VECTORS_DSN: postgresql://postgres:postgres@soothe-pgvector:5432/soothe_vectors
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__HOST: 0.0.0.0
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__PORT: 18765
      SOOTHE_DEBUG: ${SOOTHE_DEBUG:-false}
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      # Daemon workdir (data, logs, pid, config base). Isolated from dev's
      # ~/.soothe so prod state survives `make reset-the-world` and vice-versa.
      - ${HOME}/.soothe-prod:/var/lib/soothe
      # Agent config: repo-tracked, read-only on top of the workdir.
      - ./nano.yml:/var/lib/soothe/config/nano.yml:ro
      # Client workspaces: expose host project dirs to the container (path
      # translation via SOOTHE_WORKSPACE_HOST_ROOT in nano.yml). Separate
      # from daemon state.
      - ${SOOTHE_WORKSPACE_HOST_ROOT:-${HOME}}:/var/lib/soothe/workspaces
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/healthz', timeout=5)" || exit 1
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  soothe-db:
  soothe-app:

volumes:
  soothe_postgres_data:
