# Soothe Host Overlay Template (soothe.yml)
# ------------------------------------------------------------
# Host-only configuration overlay. Compose with nano.yml.
# This file must not contain nano-owned/shared keys.

agent:
  autopilot:
    enabled: true
    max_retries: 2
    max_total_goals: 99
    max_goal_depth: 5
    # Cap goal fan-out under typical provider concurrency quotas.
    max_parallel_goals: 3
    # Goal GC — cancel non-terminal goals whose job root is already terminal.
    gc_enabled: true
    gc_interval_seconds: 120
    max_send_backs: 3
    max_engine_recoveries: 2
    checkpoint_interval: 10
    # Dreaming is automatic (DAG complete / timer) and config-driven — no CLI dream/wake.
    # Wake happens on submit or scheduled task. Set dreaming_enabled: false to disable.
    dreaming_enabled: true
    monitor_model_role: think
    # Report-commit judgment; empty deny spawn/cancel dag_ops.
    consensus_model_role: think
    judge_allow_structural_dag_ops: []
    default_rail: null
    # LLM LoopRail auto-pick when submit omits rail_id.
    rail_auto_pick: true
    rail_auto_pick_min_confidence: 0.6
    rail_auto_pick_model_role: null
    rail_auto_pick_timeout_s: 120
    rail_auto_pick_deny: []
    rail_auto_pick_max_candidates: 32
    rail_auto_pick_skip_if_workspace_default: false
    rail_auto_pick_abstain_overrides_defaults: true
    # Veritas auto-clarify before pause_for_user CE suspend.
    # PROCEED skips suspend and fires user_intervention; false = always suspend.
    rail_pause_auto_clarify: true
    # Forced StrangeLoop intake for dispatched goals (null|minimal|simple|complex).
    # null (default) lets the loop classify; minimal/simple/complex skip Pass 1+2.
    intake_scope: null
    # Master switch for periodic DAG health verification (structural + LLM).
    # false (default) skips the background health tick entirely; event-driven
    # verification (post-completion, backoff) still runs. The resource watchdog
    # tick still runs on the same cadence.
    verify_periodic_enabled: false
    verify_interval: 120
    # Idle tick (empty/all-terminal). 0 = reuse verify_interval. LLM skipped while idle.
    verify_idle_interval: 300
    verify_llm_enabled: true
    verify_llm_min_nonterminal: 1
    verify_llm_debounce: true
    dreaming_interval: 300
    webhooks: {}
    notify:
      enabled: false
      suspend_after_seconds: 2700
      suspend_escalation_multiplier: 2.0
      dedup_ttl_seconds: 86400
      # All job lifecycle events enabled by default. Suppress specific kinds
      # via notify.events.disabled (set of kind strings, e.g. ['sla.overdue']).
      targets: []
      sinks:
        email:
          enabled: false
          smtp_host: ""
          smtp_port: 587
          # Plain string or ${ENV_VAR} (same dual rule as providers[].api_key).
          smtp_username: "${SOOTHE_SMTP_USERNAME}"
          smtp_password: "${SOOTHE_SMTP_PASSWORD}"
          smtp_use_tls: true
          smtp_use_ssl: false
          from_address: ""
          connect_timeout_seconds: 30.0
          max_retries: 2
          rate_limit_seconds: 5.0
          targets: []
        webhook:
          enabled: false
          urls:
            job_completed: null
            job_failed: null
            job_suspended_timeout: null
            sla_overdue: null
          timeout_seconds: 15.0
        feishu:
          enabled: false
          # Plain string or ${ENV_VAR}.
          app_id: "${FEISHU_APP_ID}"
          app_secret: "${FEISHU_APP_SECRET}"
          targets: []
      sla:
        enabled: false
        warning_after_seconds: 3600
        critical_after_seconds: 7200
        breach_after_seconds: 14400
        track_root_goals_only: true
    max_loops: 16
    loop_idle_timeout: 300
    poll_interval: 5
    dreaming_poll_interval: 60
    goal_deadline_seconds: 1209600
    context_projection:
      max_findings: 20
      max_effects: 50
      max_plan_steps: 30
      context_retention_hours: 168
      max_context_entries: 1000
    workspace_reservation:
      enabled: true
      strict_overlap: true
    # Lifecycle reclamation — tear down a goal's runtime (spawned background
    # processes, slice worktrees) when it reaches a terminal state.
    lifecycle_drain_grace_seconds: 2.0
    lifecycle_worktree_recycle_enabled: true

  loop:
    enabled: true
    # Shared StrangeLoop budget (interactive + Autopilot workers). Do not redefine under autopilot.
    max_iterations: 99
    # Recursive step decomposition budgets (RFC-904; always on for step THREADS).
    decompose:
      max_depth: 3
      max_steps: 30
      max_recompose: 2
      max_waves: 10
      max_branch_root: 5
      max_branch_inner: 3
      reconcile_model_role: fast
    # Fresh readonly coverage-audit thread (RFC-905); runs only when required.
    eval:
      max_eval_rounds: 10
    max_tool_calls_per_step: 500
    read_only_streak_limit: 50
    dispatch_idle_seconds: 300
    dispatch_tool_timeout_seconds: 0
    execute_action_retry_max: 1
    execute_min_answer_chars: 20
    execute_deliverable_assess: auto
    step_completion_report_max_words: 50
    max_subagent_tasks_per_wave: 4
    general_purpose_subagent: "off"
    strange_loop_output_contract_enabled: true
    goal_completion_mode: llm_only
    final_response: always_synthesize
    step_brief_hydration_enabled: true
    prior_conversation_limit: 10
    context_window_limit: 200000
    context_overflow_threshold_pct: 0.8
    context_compaction_target_pct: 0.6
    step_context_check_enabled: false
    goal_synthesis_model_role: default
    rules:
      completion:
        dag_dependency_threshold: 3
        low_success_rate_threshold: 0.6
        simple_ledger_direct_max_steps: 1
        ledger_direct_max_tool_calls: 50
      scenario:
        skip_llm_when_single_step: true
        skip_llm_when_all_failed: true
        high_step_count_threshold: 4
        low_evidence_volume_threshold: 2000
    output_streaming:
      mode: adaptive
      streaming_interval_ms: 100
      tui_flush_interval_ms: 200
      tui_first_flush_interval_ms: 50
      adaptive_threshold_chars: 500
      adaptive_block_chars: 500
      adaptive_block_interval_ms: 250
      file_output_threshold_chars: 0
      file_output_preview_chars: 500
      file_output_dir: null
      message_coalesce_enabled: true
      tool_batch_enabled: true
      tool_batch_interval_ms: 500
      suppress_redundant_stream_tool_updates: true
      skip_redundant_tool_message_wire: true
    working_memory:
      enabled: true
      max_inline_chars: 4000
      max_entry_chars_before_spill: 1500
    goal_context:
      plan_limit: 10
      execute_limit: 10
      enabled: true
    plan_prompt_ledger:
      plan_ledger_max_messages: 40
      plan_ledger_max_total_chars: 200000
      plan_ledger_max_message_chars: 200000
      preamble_max_turns: 12
      prior_goal_tail: 3
    execute_prompt_ledger:
      cross_goal_completion_tail: 3
      predecessor_max_messages: 96
      execute_ai_ledger_max_tokens: 65536
    report_output:
      display_threshold: 20000
      preview_chars: 500
      synthesis_max_chars: 0
    checkpoint:
      progressive: true
      auto_resume_on_start: false
      auto_resume_max_loops: 16
      auto_resume_max_age_hours: 24
      auto_resume_clarifications: skip
    concurrency:
      # Keep below provider in-flight quota; pair with nano
      # llm_rate_limit.global_concurrent_limit (template: 18 for AP+CLI headroom).
      # Goal fan-out: agent.autopilot.max_parallel_goals (not a loop concurrency key).
      max_parallel_steps: 3
      max_parallel_subagents: 3
      global_max_llm_calls: 8
      step_parallelism: dependency
      max_parallel_tools: 99
      checkpoint:
        flush_interval: 5.0
        close_timeout_seconds: 30
        durable_flush_timeout: 10
    loop_orchestrator_evidence_validate: true

  clarification:
    auto_policy: veritas
    auto_min_confidence: 0.4
    degrade_to_manual_on_low_confidence: true
    max_defer_age_hours: 168
    default_mode: auto
    # StrangeLoop plan_generate/plan_assess are *not* listed here.
    # plan_mode_review — plan approve/reject/refine gate is a human call.
    # tool_approval is intentionally NOT listed: in auto mode the multi-stage
    # pipeline (§9b) resolves most tool actions deterministically; veritas
    # handles the ambiguous tail. Re-add tool_approval here to route every
    # non-rejected tool action through a human (deny/safety stages still
    # auto-reject dangerous actions).
    force_manual_origins:
      - plan_mode_review

    # RFC-622 §9b: Multi-stage tool-approval pipeline.
    # Deterministic deny → safety → allow stages resolve most tool_approval
    # interrupts without an LLM. Veritas remains the final guard for ambiguous
    # cases. Set enabled: false to send all tool_approval to veritas (pre-§9b).
    tool_approval:
      enabled: true
      # Manual-mode scope (default_mode: manual): deny/safety stages always
      # auto-reject dangerous actions without asking. "all" asks the human
      # for every remaining action; "ambiguous_only" also auto-approves
      # allow-rule matches, so only rule-unresolved actions reach the human.
      manual_scope: all
      deny_rules:                      # Stage 1: match = REJECT
        - { tool: run_command, pattern: "rm -rf *" }
        - { tool: run_command, pattern: "sudo *" }
        - { tool: run_command, pattern: "chmod 777 *" }
        - { tool: run_command, pattern: "git push --force*" }
        - { tool: run_command, pattern: "git push -f*" }
        - { tool: run_command, pattern: "dd if=*" }
        - { tool: run_command, pattern: "mkfs*" }
        - { tool: edit_file, pattern: "/etc/**" }
        - { tool: write_file, pattern: "/etc/**" }
      # Stage 2: safety checks are built-in, bypass-immune (not configurable).
      allow_rules:                      # Stage 3: match = APPROVE
        - { tool: edit_file, pattern: "<workspace>/**" }
        - { tool: write_file, pattern: "<workspace>/**" }
        - { tool: run_command, pattern: "ls *" }
        - { tool: run_command, pattern: "cat *" }
        - { tool: run_command, pattern: "grep *" }
        - { tool: run_command, pattern: "find *" }
        - { tool: run_command, pattern: "pytest*" }
        - { tool: run_command, pattern: "python -m pytest*" }
        - { tool: run_command, pattern: "ruff *" }
        - { tool: run_command, pattern: "mypy *" }
        - { tool: run_command, pattern: "git status" }
        - { tool: run_command, pattern: "git diff*" }
        - { tool: run_command, pattern: "git log*" }
      veritas_fallback:                 # Stage 4: LLM for ambiguous cases
        enabled: true
        model_role: fast
        max_context_steps: 0
        inline_project_instructions: false
      audit:
        log_decisions: true
        log_level: info

  veritas:
    model_role: think
    max_context_steps: 8
    max_retries: 2
    retry_backoff_seconds: 2.0
    coerced_confidence: 0.7

skillify:
  enabled: false
  model_role: embedding
  warehouse_paths: []
  index_collection: soothe_skillify
  index_interval_seconds: 300
  retrieval_top_k: 10

cron:
  max_jobs: 100
  poll_interval: 60
  extraction_model: fast
  extraction_timeout: 30
  default_priority: 50
  timezone: local
  enable_builtin_jobs: true
