# Soothe Host Overlay Template (soothe.yml)
# Host-only overlay. Compose with nano.yml. No nano-owned keys here.

agent:
  autopilot:
    enabled: true
    max_retries: 2
    max_parallel_goals: 3  # cap goal fan-out under provider concurrency quotas
    gc_enabled: true  # cancel non-terminal goals whose job root is already terminal
    gc_interval_seconds: 120
    max_send_backs: 3
    max_engine_recoveries: 2
    # Dreaming is automatic (DAG complete / timer); wake on submit or scheduled task.
    dreaming_enabled: true
    monitor_model_role: think
    consensus_model_role: think  # report-commit judgment; empty deny spawn/cancel dag_ops
    judge_allow_structural_dag_ops: []
    default_rail: null
    # LLM LoopRail auto-pick when submit omits rail_id.
    rail_auto_pick: true
    rail_auto_pick_min_confidence: 0.6
    rail_auto_pick_model_role: null
    rail_auto_pick_timeout_s: 120
    rail_auto_pick_deny: []
    rail_auto_pick_max_candidates: 32
    rail_auto_pick_skip_if_workspace_default: false
    rail_auto_pick_abstain_overrides_defaults: true
    # Auto-clarify before pause_for_user CE suspend. PROCEED skips suspend.
    rail_pause_auto_clarify: true
    # Forced StrangeLoop intake (null|minimal|simple|complex). null lets loop classify.
    intake_scope: null
    # Periodic DAG health verification (structural + LLM). false skips background tick;
    # event-driven verification still runs. Resource watchdog tick unaffected.
    verify_periodic_enabled: false
    verify_interval: 120
    verify_idle_interval: 300  # idle tick; 0 = reuse verify_interval. LLM skipped while idle.
    verify_llm_enabled: true
    verify_llm_min_nonterminal: 1
    verify_llm_debounce: true
    webhooks: {}
    notify:
      enabled: false
      suspend_after_seconds: 2700
      suspend_escalation_multiplier: 2.0
      dedup_ttl_seconds: 86400
      # All job lifecycle events enabled by default. Suppress via notify.events.disabled.
      targets: []
      sinks:
        email:
          enabled: false
          smtp_host: ""
          smtp_port: 587
          smtp_username: "${SOOTHE_SMTP_USERNAME}"  # plain string or ${ENV_VAR}
          smtp_password: "${SOOTHE_SMTP_PASSWORD}"
          smtp_use_tls: true
          smtp_use_ssl: false
          from_address: ""
          connect_timeout_seconds: 30.0
          max_retries: 2
          rate_limit_seconds: 5.0
          targets: []
        webhook:
          enabled: false
          urls:
            job_completed: null
            job_failed: null
            job_suspended_timeout: null
            sla_overdue: null
          timeout_seconds: 15.0
        feishu:
          enabled: false
          app_id: "${FEISHU_APP_ID}"  # plain string or ${ENV_VAR}
          app_secret: "${FEISHU_APP_SECRET}"
          targets: []
      sla:
        enabled: false
        warning_seconds: 3600
        critical_seconds: 7200
        breach_seconds: 14400
    max_loops: 16
    loop_idle_timeout: 300
    poll_interval: 5
    dreaming_poll_interval: 60
    goal_deadline_seconds: 1209600
    context_projection:
      max_findings: 20
      max_effects: 50
      max_plan_steps: 30

  # agent.loop: StrangeLoop execution controls. Only non-default overrides shown;
  # see soothe.config.models.StrangeLoopConfig / LoopConcurrencyConfig for all fields.
  loop:
    concurrency:
      max_parallel_steps: 3       # max concurrent plan steps per execute batch
      global_max_llm_calls: 3     # max concurrent LLM streams (≤ max_parallel_steps; 0=unlimited)
