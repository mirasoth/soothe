# Soothe Host Overlay Template (soothe.yml)
# ------------------------------------------------------------
# Host-only configuration overlay. Compose with nano.yml.
# This file must not contain nano-owned/shared keys.
#
# This template contains only critical, user-configurable settings.
# All omitted keys fall back to dataclass defaults (see
# soothe.config.models.AgentConfig / AutopilotConfig / StrangeLoopConfig).
# Full tuning reference: soothed config docs

agent:
  # === DAG safety bounds ===
  autopilot:
    enabled: true
    max_retries: 2
    max_total_goals: 99
    max_goal_depth: 5
    max_parallel_goals: 3
    max_send_backs: 3
    max_engine_recoveries: 2
    # Loop lifecycle bounds
    max_loops: 16
    loop_idle_timeout: 300
    poll_interval: 5
    # Wall-clock budget per dispatched goal (None disables; default 14d)
    # goal_deadline_seconds: 1209600

    # === Notify (multi-channel job lifecycle push) ===
    # Set enabled: true and configure sinks to receive job-completed/failed/suspended events.
    notify:
      enabled: false
      # targets: [...]               # recipient identifiers
      # sinks:
      #   email:   {enabled: true, smtp_host: smtp.example.com, ...}
      #   webhook: {enabled: true, urls: {job_completed: https://..., ...}}
      #   feishu:  {enabled: true, app_id: "${FEISHU_APP_ID}", ...}

  # === StrangeLoop loop budget (shared: interactive + Autopilot workers) ===
  loop:
    enabled: true
    max_iterations: 99

  # === Clarification relay ===
  clarification:
    # auto = veritas auto-answerer; manual = interactive TUI relay
    default_mode: auto

  # === Veritas auto-answerer ===
  veritas:
    model_role: think

# ============================================================================
# CRON — natural language scheduled job submission for Autopilot
# ============================================================================
cron:
  max_jobs: 100
  poll_interval: 60
  timezone: local
