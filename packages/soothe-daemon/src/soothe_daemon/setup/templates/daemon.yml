# Soothe daemon server configuration (SootheDaemonConfig)
# Install: ~/.soothe/config/daemon.yml
# CLI: soothed --config <path>
# Env overrides: SOOTHE_DAEMON_<KEY> or nested SOOTHE_DAEMON_<SECTION>__<KEY>
#
# This template contains only critical, user-configurable settings.
# All omitted keys fall back to dataclass defaults (see
# soothe_daemon.config.settings.SootheDaemonConfig).
# Full tuning reference: soothed config docs

# ============================================================================
# TRANSPORT — bind address for the WebSocket server (required transport)
# ============================================================================
transports:
  websocket:
    host: 127.0.0.1
    port: 8765
    # tls_enabled: true          # uncomment for TLS
    # tls_cert: /path/to/cert
    # tls_key: /path/to/key
    # cors_origins: [...]        # override for browser clients

# ============================================================================
# IDENTITY — AKSK auth & JWT tokens. Disabled by default (no auth).
# ============================================================================
identity:
  enabled: false

# ============================================================================
# RUNNER MODE — enable exactly ONE (thread_pool | worker_pool | distributed)
# ============================================================================
# thread_pool (DEFAULT): lightweight async, fast startup, shared PG pool.
# worker_pool: process isolation, own PG pool per subprocess.
# distributed: Ray cluster for horizontal scaling.
thread_pool:
  enabled: true
  # For 50–100 concurrent loops: raise max_pool_size to 96–100 and align
  # persistence.postgres.*_pool_size behind PgBouncer.
  # max_pool_size: 96

# worker_pool:
#   enabled: true
#   max_pool_size: 4

# distributed:
#   enabled: true

# ============================================================================
# CONCURRENCY — resource ceilings (0 = unlimited)
# ============================================================================
max_concurrent_threads: 100
max_concurrent_dispatches: 50

# ============================================================================
# TIMEOUTS & CANCELLATION — safety bounds
# ============================================================================
max_query_duration_minutes: 1440  # 24h; 0 = unlimited (not recommended)
thread_max_age_hours: 24
