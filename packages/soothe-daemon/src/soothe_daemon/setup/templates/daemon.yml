# Soothe Daemon Configuration Template (daemon.yml)
# Install: ~/.soothe/config/daemon.yml | CLI: soothed --config <path>
# Env overrides: SOOTHE_DAEMON_<KEY> or SOOTHE_DAEMON_<SECTION>__<KEY>

# Transports
transports:
  websocket:
    enabled: true
    host: 127.0.0.1
    port: 8765
    tls_enabled: false
    tls_cert: null
    tls_key: null
    cors_origins:
      - http://localhost:*
      - http://127.0.0.1:*
    max_frame_size: 10485760  # 10MB
    heartbeat_interval_ms: 30000
    heartbeat_timeout_ms: 10000

# Channels (global settings; bind address/port under transports.websocket)
channels:
  send_progress: true
  send_tool_hints: false
  show_reasoning: true
  send_max_retries: 3
  # ACP (Agent Client Protocol) — stdio JSON-RPC server for editor/IDE integration
  # Enable for standalone ACP mode (run `soothe-acp`); disable WebSocket when ACP is sole channel
  acp:
    enabled: false
    agent_name: "Soothe"
    agent_description: "Soothe autonomous agent"
    default_model: null
    session_timeout_seconds: 3600

# Concurrency
max_concurrent_threads: 100
max_concurrent_dispatches: 50
max_concurrent_vision_preflight: 8  # 0 = unlimited
max_in_flight_broadcasts_per_loop: 80  # 0 = unlimited
card_ingest_queue_maxsize: 2000
card_flush_debounce_ms: 200
max_input_queue_size: 1000

# Timeouts & cancellation
max_query_duration_minutes: 1440  # 24h; 0 = unlimited (not recommended)
thread_max_age_hours: 24
cancel_retry_count: 3
cancel_retry_interval_seconds: 2.0
cancel_force_kill_timeout_seconds: 10.0
auto_cancel_on_startup: true

# Loop GC — ephemeral (is_ephemeral=true) and empty (zero messages) passes
loop_gc:
  enabled: true
  interval_seconds: 3600
  ephemeral_idle_hours: 24
  empty_idle_hours: 24
  batch_size: 50

# Loop status reconciliation — demote stale running loops missing heartbeat
loop_status_reconciliation:
  enabled: true
  interval_seconds: 300
  stale_running_seconds: 180  # ~6 heartbeat windows
  batch_size: 100

# Stale worker reap (also requires loop_runner.runner_mode='process_pool')
stale_worker_reap:
  enabled: true
  interval_seconds: 1800

# Observability
event_size_stats_enabled: true
event_size_stats_interval_seconds: 60
event_size_stats_idle_pause_seconds: 120

# Memory profiling (tracemalloc; RPC: /memory mode=daemon|gc|snapshot|objects|compare)
memory_profiling:
  enabled: false
  trace_depth: 25
  top_allocations_limit: 20
  log_growth_threshold_mb: 100

# ============================================================================
# LOOP RUNNER (RFC-221)
# ============================================================================
# Select exactly ONE runner substrate via `runner_mode`. Each mode's tuning
# knobs live in its own nested block below.
#
#   thread_pool:     Lightweight async, fast startup (DEFAULT)
#   process_pool:    Process-based isolation (subprocess spawn, ~8s overhead)
#   ray:             Ray cluster for horizontal scaling
#   firecracker:     Firecracker microVM isolation (strongest isolation, Linux ONLY)
loop_runner:
  runner_mode: thread_pool

  # Thread pool — DEFAULT. Daemon-level singleton PG pool shared by all threads.
  thread_pool:
    min_pool_size: 4
    max_pool_size: 32
    idle_timeout_seconds: 300
    max_requests_per_thread: 100
    request_timeout_seconds: 1209600  # 14d; 0 = no timeout
    thread_startup_timeout_seconds: 60
    reuse_runner: true
    warmup_runner: true
    warmup_core_agent: true

  # Process pool — subprocess isolation. Each worker has its OWN PG pool.
  process_pool:
    min_pool_size: 2
    max_pool_size: 4
    idle_timeout_seconds: 300
    max_requests_per_worker: 100
    request_timeout_seconds: 0  # 0 = no timeout
    heartbeat_interval_seconds: 30
    stuck_worker_timeout_seconds: 180
    reuse_runner: true
    warmup_runner: true
    warmup_core_agent: true
    dispatch_wait_stats_enabled: true
    dispatch_wait_stats_interval_seconds: 60
    dispatch_wait_stats_idle_pause_seconds: 120

  # Ray — distributed cluster execution (Ray actors).
  ray:
    address: null  # null = auto-detect
    num_cpus: 0.0  # 0 = auto
    object_store_memory: 0  # 0 = auto
    max_concurrent_actors: 10
    actor_lifetime: detached
    log_to_driver: true

  # Firecracker — microVM isolation (RFC-221).
  # OFFICIALLY SUPPORTED ON LINUX ONLY.
  firecracker:
    firecracker_binary_path: firecracker  # PATH lookup or absolute path
    kernel_image_path: ""                   # e.g. /var/lib/soothe/vmlinux
    rootfs_image_path: ""                    # e.g. /var/lib/soothe/rootfs.ext4
    min_pool_size: 1                         # warm microVMs at daemon startup
    max_pool_size: 4                         # max microVMs under load
    vsock_port_base: 1024                    # per-VM port = base + worker_index
    vm_cpu_count: 2                          # vCPUs per microVM
    vm_mem_mib: 2048                         # memory per microVM (MiB)
    idle_timeout_seconds: 300                # idle VM shutdown grace
    max_requests_per_worker: 100             # respawn after N requests
    request_timeout_seconds: 0               # 0 = no timeout
    reuse_runner: true                       # reuse one SootheRunner per VM
    warmup_runner: true                      # cache SootheRunner at VM startup
    warmup_core_agent: true                  # materialize LazyCoreAgent during warmup
    workspace_mount_mode: virtiofs           # virtiofs (local) | sync (S3 backend)
    extra_kernel_args: ""                    # extra kernel cmdline args at boot
