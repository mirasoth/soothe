id: pr-review
version: "1.2"

summary: |
  Independent review of an existing change set: read the diff, record
  findings, then run QA. Starts at review; does not open an implementation
  branch.

applies_when: |
  Review a pull request, patch, or diff the user already produced.

conditions:
  needs_qa: |
    Review completed; automated verification should run after review.
  needs_human: |
    Review found a blocking design or security concern that needs an owner
    decision before the job can close.
  job_complete: |
    Review, QA, and any human ack finished with findings recorded and no
    pending children remain.

flow:
  - event: job_start
    then: review

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_human
    then: pause_for_user

  - event: dag_idle
    when: needs_human
    then: pause_for_user

  - event: dag_idle
    when: job_complete
    then: complete_job
