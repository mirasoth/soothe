id: migration
version: "2.10"

summary: |
  Multi-step migration or upgrade: architecture milestones with WavePlan
  slice catalog, streaming makers with host job-branch merge, per-maker
  review/QA, feedback cycles, and pause on irreversible cutover.

applies_when: |
  Framework upgrade, schema migration, API version bump, or multi-file
  mechanical migration with a clear done condition.

fanout:
  require_plan: true
  max_waves: 32

verbs:
  plan_milestones:
    do:
      - spawn_goal:
          id: planner
          role: planner
          tags: [architecture, planning, milestones]
          priority: 80
          brief: |
            Migration architecture and milestone map for job {job_id}. Partition
            the migration into independent WavePlan slices (migration stages
            such as schema batches, dual-write paths, cutover-prep, or backfill
            stages). Define wave-1 independent slices, wave acceptance /
            invariant checks, and git commit milestones. Do not implement
            migration code here.

            REQUIRED deliverable: one flat WavePlan JSON object
            (wave_slices string list or flat slices[{"slice",…}]; nested
            WAVE trees forbidden). Host SoT is job rail state after ingest.
            Suggested dumps (optional, not required):
            <workspace>/.soothe/wave-plan.json or
            $SOOTHE_DATA_DIR/jobs/{job_id}/wave-plan.json. Also OK: set
            completion wave_plan_path to any file under the workspace, inline
            completion wave_plan, or a flat JSON blob in the goal completion
            report. Schema example:
            {"wave_slices":["schema","dual-write","cutover-prep","verify"],
            "independence":"disjoint write-sets per migration slice",
            "rationale":"why this partition"}
            Optionally use rich flat `slices` entries
            ({"slice","description","tags"}) and/or `max_waves`.
            Prose alone is not enough — never substitute a fixed default
            slice list. Slices must be independent (no overlapping primary
            write sets).
          wire:
            root_waits_on: self

conditions:
  architecture_ready: |
    The architecture / migration milestone map goal completed, and makers
    have not been spawned yet.
  slices_ready_to_spawn: |
    At least one catalog slice is unspawned and its slice depends_on are
    satisfied (or omitted).
  maker_needs_merge: |
    An implementation maker completed and its branch has not been host-merged
    into the job branch yet.
  needs_qa: |
    A per-maker review passed or was skipped by policy; slice acceptance
    tests and migration invariant verification should run for that lineage.
  needs_feedback: |
    Wave QA or a prior feedback verify finished, migration acceptance is
    not yet met, and another find→optimize→verify round should close
    remaining gaps.
  needs_human: |
    Next step is irreversible (production migrate, data backfill, or cutover).
  branch_is_stuck: |
    A maker or implementation goal failed, or evidence shows the approach
    conflicts with the migration architecture.
  architecture_failed: |
    The architecture / migration milestone map goal failed (no usable
    WavePlan for fan-out), and a fresh planner attempt should replace it.
  job_complete: |
    Declared migration success condition holds in checkable terms and the
    DAG is idle with no pending children.

flow:
  - event: job_start
    then: plan_milestones

  - event: goal_completed
    when: architecture_ready
    then: spawn_wave_makers

  - event: dag_idle
    when: architecture_ready
    then: spawn_wave_makers

  - event: goal_completed
    when: maker_needs_merge
    then: merge_branches

  - event: goal_completed
    when: slices_ready_to_spawn
    then: spawn_wave_makers

  - event: dag_idle
    when: slices_ready_to_spawn
    then: spawn_wave_makers

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: dag_idle
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_failed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_completed
    when: needs_human
    then: pause_for_user

  - event: dag_idle
    when: needs_human
    then: pause_for_user

  - event: goal_failed
    when: branch_is_stuck
    then: retry_maker

  - event: goal_failed
    when: architecture_failed
    then: retry_architecture

  - event: dag_idle
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: dag_idle
    when: job_complete
    then: complete_job
