id: migration
version: "2.6"

summary: |
  Multi-step migration or upgrade: architecture milestones with WavePlan
  slice/wave partitions, parallel makers, integrate, commit gate, review,
  wave QA, feedback cycles, and pause on irreversible cutover.

applies_when: |
  Framework upgrade, schema migration, API version bump, or multi-file
  mechanical migration with a clear done condition.

fanout:
  require_plan: true
  max_waves: 3

verbs:
  plan_milestones:
    do:
      - spawn_goal:
          id: planner
          role: planner
          tags: [architecture, planning, milestones]
          priority: 80
          brief: |
            Migration architecture and milestone map for job {job_id}. Partition
            the migration into independent WavePlan slices (migration stages
            such as schema batches, dual-write paths, cutover-prep, or backfill
            stages). Define wave-1 independent slices, wave acceptance /
            invariant checks, and git commit milestones. Do not implement
            migration code here.

            REQUIRED deliverable: include one bare WavePlan JSON object in the
            goal completion report (final evidence / completion findings on the
            wire). The host applies fan-out from that completion finding into
            job rail state. Do NOT write FINDINGS.md, wave-plan.json, or any
            other project/jobs path as the fan-out deliverable — those files
            are ignored. Schema example:
            {"wave_slices":["schema","dual-write","cutover-prep","verify"],
            "independence":"disjoint write-sets per migration slice",
            "rationale":"why this partition"}
            Optionally use rich `slices` entries
            ({"slice","description","priority","tags"}) and/or `max_waves`.
            Prose alone is not enough — never substitute a fixed default
            slice list. Slices must be independent (no overlapping primary
            write sets).
          wire:
            root_waits_on: self

conditions:
  architecture_ready: |
    The architecture / migration milestone map goal completed, and the
    first wave of independent maker goals has not been spawned yet.
  wave_makers_done: |
    All maker goals for the current wave completed successfully.
  needs_commit: |
    Integrate finished (or makers finished when integrate was skipped) and
    a milestone git commit gate should run before review.
  needs_review: |
    Commit milestone completed; independent diff-scoped code review should
    run against the job branch / commit range.
  needs_qa: |
    Review passed or was skipped by policy; wave acceptance tests and
    migration invariant verification should run.
  needs_feedback: |
    Wave QA or a prior feedback verify finished, migration acceptance is
    not yet met, and another find→optimize→verify round should close
    remaining gaps.
  ready_for_next_wave: |
    Feedback verify (or exhausted feedback) shows the wave is ready, the
    DAG has no pending children, and further migration milestone slices
    remain in the architecture map.
  needs_human: |
    Next step is irreversible (production migrate, data backfill, or cutover).
  branch_is_stuck: |
    A maker or implementation goal failed, or evidence shows the approach
    conflicts with the migration architecture.
  architecture_failed: |
    The architecture / migration milestone map goal failed (no usable
    WavePlan for fan-out), and a fresh planner attempt should replace it.
  job_complete: |
    Declared migration success condition holds in checkable terms and the
    DAG is idle with no pending children.

flow:
  - event: job_start
    then: plan_milestones

  - event: goal_completed
    when: architecture_ready
    then: spawn_wave_makers

  - event: dag_idle
    when: architecture_ready
    then: spawn_wave_makers

  - event: goal_completed
    when: wave_makers_done
    then: spawn_integrate

  - event: goal_completed
    when: needs_commit
    then: commit_milestone

  - event: dag_idle
    when: needs_commit
    then: commit_milestone

  - event: goal_completed
    when: needs_review
    then: review

  - event: dag_idle
    when: needs_review
    then: review

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: dag_idle
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_failed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_completed
    when: ready_for_next_wave
    then: spawn_wave_makers

  - event: dag_idle
    when: ready_for_next_wave
    then: spawn_wave_makers

  - event: goal_completed
    when: needs_human
    then: pause_for_user

  - event: dag_idle
    when: needs_human
    then: pause_for_user

  - event: goal_failed
    when: branch_is_stuck
    then: retry_maker

  - event: goal_failed
    when: architecture_failed
    then: retry_architecture

  - event: dag_idle
    when: wave_makers_done
    then: spawn_integrate

  - event: dag_idle
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: dag_idle
    when: job_complete
    then: complete_job
