id: greenfield-system
version: "1.6"

summary: |
  Greenfield multi-module system build: architecture milestones, parallel
  makers (git worktrees when available), integrate, commit gate, diff-scoped
  review, wave QA, then find→optimize→verify feedback cycles until system
  acceptance. Differs from feature-dev by rejecting a single maker pass,
  never wiring makers to depend on the job root, and closing gaps with a
  feedback loop before next wave or job completion.

applies_when: |
  Building a new multi-module system or large scaffold from scratch
  (compiler, platform, multi-crate product), not a feature in an existing
  mature codebase, hotfix, bugfix, or research spike.

# Fan-out is LoopRail policy — not AutopilotService / submit API.
# Module list is LLM-authored (WavePlan JSON in architecture findings);
# host ingests findings into a job-scoped artifact under
# $SOOTHE_DATA_DIR/jobs/{job_id}/. Rail only declares the contract path
# template + require_plan. Engine clamps to max_parallel_goals.
fanout:
  artifact: "{job_id}/wave-plan.json"
  require_plan: true
  max_waves: 3

# RFC-231 M2/M3: catalog verb body — ``do:`` L0 recipe for plan_milestones.
verbs:
  plan_milestones:
    do:
      - spawn_goal:
          id: planner
          role: planner
          tags: [architecture, planning, milestones]
          priority: 80
          brief: |
            Architecture and milestone map for job {job_id}. Define module
            boundaries, wave-1 independent ownership units, wave acceptance
            criteria, and git commit milestones. Do not implement product code
            here.

            REQUIRED deliverable: append one findings entry that is exactly a
            WavePlan JSON object (host persists fan-out for this job — do not
            write fan-out policy into the project workspace tree; never write
            docs/wave-plan.json or .soothe/wave-plan.json as the plan). Schema
            example:
            {"wave_modules":["frontend","ir","passes","backend","driver","tests"],
            "independence":"disjoint write-sets per module",
            "rationale":"why this partition"}
            Optionally use rich `modules` entries
            ({"module","description","priority","tags"}) and/or `max_waves`.
            Prose alone is not enough (never scrapes markdown, never substitutes
            a fixed default module list). Modules must be independent (no
            overlapping primary write sets). Autopilot only clamps spawn width
            to max_parallel_goals.
          wire:
            root_waits_on: self

conditions:
  architecture_ready: |
    The architecture / milestone map goal completed, and the first wave of
    independent maker goals has not been spawned yet.
  wave_makers_done: |
    All maker goals for the current wave completed successfully.
  needs_integrate: |
    Wave makers finished and cross-module integrate / merge work remains.
  needs_commit: |
    Integrate finished (or makers finished when integrate was skipped) and
    a milestone git commit gate should run before review.
  needs_review: |
    Commit milestone completed; independent diff-scoped code review should
    run against the job branch / commit range.
  needs_qa: |
    Review passed or was skipped by policy; wave acceptance tests and build
    verification should run.
  needs_feedback: |
    Wave QA or a prior feedback verify finished, system acceptance is not
    yet met, and another find→optimize→verify round should close remaining
    bugs and gaps.
  ready_for_next_wave: |
    Feedback verify (or exhausted feedback) shows the wave is ready, the DAG
    has no pending children, and further milestones remain in the
    architecture map.
  branch_is_stuck: |
    A maker, integrate, review, or QA goal failed twice or evidence shows
    the approach conflicts with the architecture.
  architecture_failed: |
    The architecture / milestone map goal failed (no usable WavePlan for
    fan-out), and a fresh planner attempt should replace it.
  job_complete: |
    Declared system acceptance holds (required binaries / golden tests /
    milestone commits) and the DAG is idle with no pending children.

flow:
  - event: job_start
    then: plan_milestones

  - event: goal_completed
    when: architecture_ready
    then: spawn_wave_makers

  # Recover when architecture completed and LLM later wrote the wave plan.
  - event: dag_idle
    when: architecture_ready
    then: spawn_wave_makers

  - event: goal_completed
    when: wave_makers_done
    then: spawn_integrate

  - event: goal_completed
    when: needs_commit
    then: commit_milestone

  - event: goal_completed
    when: needs_review
    then: review

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_failed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_completed
    when: ready_for_next_wave
    then: spawn_wave_makers

  - event: goal_failed
    when: branch_is_stuck
    then: retry_maker

  - event: goal_failed
    when: architecture_failed
    then: retry_architecture

  # Recover when makers finished but integrate never spawned (e.g. pruned
  # retries previously blocked wave_makers_done on the last maker completion).
  - event: dag_idle
    when: wave_makers_done
    then: spawn_integrate

  - event: dag_idle
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: dag_idle
    when: job_complete
    then: complete_job
