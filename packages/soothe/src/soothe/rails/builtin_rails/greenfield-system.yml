id: greenfield-system
version: "1.10"

summary: |
  Multi-slice system build from scratch: architecture milestones, parallel
  makers (git worktrees when available), integrate, commit gate, diff-scoped
  review, wave QA, then find→optimize→verify feedback cycles until system
  acceptance.

applies_when: |
  Building a new multi-part system or large scaffold from scratch.

fanout:
  require_plan: true
  max_waves: 3

verbs:
  plan_milestones:
    do:
      - spawn_goal:
          id: planner
          role: planner
          tags: [architecture, planning, milestones]
          priority: 80
          brief: |
            Architecture and milestone map for job {job_id}. Define Slice
            boundaries (independent parallel ownership units — features,
            tasks, packages, or stages), wave-1 independent slices, wave
            acceptance criteria, and git commit milestones. Do not implement
            product code here.

            REQUIRED deliverable: append one findings entry that is exactly a
            WavePlan JSON object. The host persists fan-out from that findings
            entry into job rail state — do not write fan-out policy into the
            project workspace. Schema example:
            {"wave_slices":["core","api","tests"],
            "independence":"disjoint write-sets per slice",
            "rationale":"why this partition"}
            Optionally use rich `slices` entries
            ({"slice","description","priority","tags"}) and/or `max_waves`.
            Prose alone is not enough — never substitute a fixed default
            slice list. Slices must be independent (no overlapping primary
            write sets).
          wire:
            root_waits_on: self

conditions:
  architecture_ready: |
    The architecture / milestone map goal completed, and the first wave of
    independent maker goals has not been spawned yet.
  wave_makers_done: |
    All maker goals for the current wave completed successfully.
  needs_commit: |
    Integrate finished (or makers finished when integrate was skipped) and
    a milestone git commit gate should run before review.
  needs_review: |
    Commit milestone completed; independent diff-scoped code review should
    run against the job branch / commit range.
  needs_qa: |
    Review passed or was skipped by policy; wave acceptance tests and build
    verification should run.
  needs_feedback: |
    Wave QA or a prior feedback verify finished, system acceptance is not
    yet met, and another find→optimize→verify round should close remaining
    bugs and gaps.
  ready_for_next_wave: |
    Feedback verify (or exhausted feedback) shows the wave is ready, the DAG
    has no pending children, and further milestones remain in the
    architecture map.
  branch_is_stuck: |
    A maker or implementation goal failed, or evidence shows the approach
    conflicts with the architecture.
  architecture_failed: |
    The architecture / milestone map goal failed (no usable WavePlan for
    fan-out), and a fresh planner attempt should replace it.
  job_complete: |
    Declared system acceptance holds and the DAG is idle with no pending
    children.

flow:
  - event: job_start
    then: plan_milestones

  - event: goal_completed
    when: architecture_ready
    then: spawn_wave_makers

  - event: dag_idle
    when: architecture_ready
    then: spawn_wave_makers

  - event: goal_completed
    when: wave_makers_done
    then: spawn_integrate

  - event: goal_completed
    when: needs_commit
    then: commit_milestone

  - event: dag_idle
    when: needs_commit
    then: commit_milestone

  - event: goal_completed
    when: needs_review
    then: review

  - event: dag_idle
    when: needs_review
    then: review

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: dag_idle
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_failed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_completed
    when: ready_for_next_wave
    then: spawn_wave_makers

  - event: dag_idle
    when: ready_for_next_wave
    then: spawn_wave_makers

  - event: goal_failed
    when: branch_is_stuck
    then: retry_maker

  - event: goal_failed
    when: architecture_failed
    then: retry_architecture

  - event: dag_idle
    when: wave_makers_done
    then: spawn_integrate

  - event: dag_idle
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: dag_idle
    when: job_complete
    then: complete_job
