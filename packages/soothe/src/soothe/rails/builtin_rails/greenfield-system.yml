id: greenfield-system
version: "1.15"

summary: |
  Multi-slice system build or migration/upgrade: architecture milestones,
  streaming makers (git worktrees when available) with host merge into a job
  branch, per-maker review/QA, find→optimize→verify feedback until acceptance,
  and pause on irreversible cutover. Land on main/master at job complete.

applies_when: |
  Building a new multi-part system or large scaffold from scratch, or a
  framework upgrade, schema migration, API version bump, or multi-file
  mechanical migration with a clear done condition.

fanout:
  require_plan: true
  max_waves: 32

verbs:
  plan_milestones:
    do:
      - spawn_goal:
          id: planner
          role: planner
          tags: [architecture, planning, milestones]
          priority: 80
          brief: |
            Architecture and milestone map for job {job_id}. Define Slice
            boundaries (independent parallel ownership units — features,
            tasks, packages, stages, or migration stages such as schema
            batches, dual-write paths, cutover-prep, or backfill), optional
            peer-slice depends_on for readiness edges, acceptance / invariant
            checks, and git commit milestones. Do not implement product or
            migration code here.

            REQUIRED deliverable: one flat WavePlan JSON object
            (wave_slices string list or flat slices[{"slice",…}]; nested
            WAVE trees forbidden). Host SoT is job rail state after ingest.
            Suggested dumps (optional, not required):
            <workspace>/.soothe/wave-plan.json or
            $SOOTHE_DATA_DIR/jobs/{job_id}/wave-plan.json. Also OK: set
            completion wave_plan_path to any file under the workspace, inline
            completion wave_plan, or a flat JSON blob in the goal completion
            report. Schema example:
            {"wave_slices":["core","api","tests"],
            "independence":"disjoint write-sets per slice",
            "rationale":"why this partition"}
            Migration-oriented example:
            {"wave_slices":["schema","dual-write","cutover-prep","verify"],
            "independence":"disjoint write-sets per migration slice",
            "rationale":"why this partition"}
            Optionally use rich flat `slices` entries
            ({"slice","description","tags","depends_on"}) and/or `max_slices`
            / `max_waves`. Prose alone is not enough — never substitute a
            fixed default slice list. Slices must be independent (no
            overlapping primary write sets). Slices with omitted depends_on
            are ready after architecture (streaming fan-out).
          wire:
            root_waits_on: self

conditions:
  architecture_ready: |
    The architecture / milestone map goal completed, the slice catalog is
    ready, and no makers have been spawned yet.
  slices_ready_to_spawn: |
    At least one catalog slice is unspawned and its slice depends_on are
    satisfied (or omitted).
  maker_needs_merge: |
    An implementation maker completed and its branch has not been host-merged
    into the job branch yet — including dag_idle while unmerged makers remain,
    or after a resolve StrangeLoop goal completes so the host can retry.
  needs_qa: |
    A per-maker review passed or was skipped by policy; slice acceptance
    tests, build verification, and migration invariant checks (when
    applicable) should run for that lineage.
  needs_feedback: |
    Wave QA or a prior feedback verify finished, system or migration
    acceptance is not yet met, and another find→optimize→verify round should
    close remaining bugs and gaps.
  needs_human: |
    Next step is irreversible (production migrate, data backfill, or cutover).
  branch_is_stuck: |
    A maker or implementation goal failed, or evidence shows the approach
    conflicts with the architecture.
  architecture_failed: |
    The architecture / milestone map goal failed (no usable WavePlan for
    fan-out), and a fresh planner attempt should replace it.
  job_complete: |
    Declared system or migration acceptance holds and the DAG is idle with
    no pending children.

flow:
  - event: job_start
    then: plan_milestones

  - event: goal_completed
    when: architecture_ready
    then: spawn_wave_makers

  - event: dag_idle
    when: architecture_ready
    then: spawn_wave_makers

  - event: goal_completed
    when: maker_needs_merge
    then: merge_branches

  - event: dag_idle
    when: maker_needs_merge
    then: merge_branches

  - event: goal_completed
    when: slices_ready_to_spawn
    then: spawn_wave_makers

  - event: dag_idle
    when: slices_ready_to_spawn
    then: spawn_wave_makers

  - event: goal_completed
    when: needs_qa
    then: qa_verify

  - event: dag_idle
    when: needs_qa
    then: qa_verify

  - event: goal_completed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_failed
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: goal_completed
    when: needs_human
    then: pause_for_user

  - event: dag_idle
    when: needs_human
    then: pause_for_user

  - event: goal_failed
    when: branch_is_stuck
    then: retry_maker

  - event: goal_failed
    when: architecture_failed
    then: retry_architecture

  - event: dag_idle
    when: needs_feedback
    then: spawn_feedback_cycle

  - event: dag_idle
    when: job_complete
    then: complete_job
