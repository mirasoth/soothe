[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soothe"
dynamic = ["version"]
description = "Soothe - Goal-driven multi-agent orchestration framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
keywords = ["soothe", "agents", "ai", "llm", "langgraph", "langchain", "multi-agent", "subagents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # First-party: sdk is a workspace member (own VERSION 1.x); nano is PyPI-only.
    "soothe-sdk>=1.0.12,<2.0.0",
    "soothe-nano>=1.2.23,<2.0.0",
    # Host-owned runtime (StrangeLoop / config / identity / checkpointers)
    "aiosqlite>=0.22.1,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jinja2>=3.1.0",
    "pyjwt>=2.8.0,<3.0.0",
    "langchain>=1.2.11,<2.0.0",
    "langchain-core>=1.2.18,<2.0.0",
    "langgraph>=1.2.11,<2.0.0",
    "langgraph-checkpoint>=4.2.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "watchdog>=3.0.0,<5.0.0",
    "fsspec>=2025.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "langfuse>=3.0.0,<4.0.0",
]
s3 = ["s3fs>=2025.0.0"]
gcs = ["gcsfs>=2025.0.0"]
azure = ["adlfs>=2025.0.0"]
all-backends = ["s3fs>=2025.0.0", "gcsfs>=2025.0.0", "adlfs>=2025.0.0"]

[project.urls]
Homepage = "https://github.com/mirasoth/soothe"
Repository = "https://github.com/mirasoth/soothe"

[tool.hatch.build.targets.wheel]
packages = ["src/soothe"]

# Ship rail XML prompt fragments and builtin rail YAML (non-.py package data) in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/soothe/rails/autoresearch_loop.xml" = "soothe/rails/autoresearch_loop.xml"
"src/soothe/rails/debug.xml" = "soothe/rails/debug.xml"
"src/soothe/rails/evals.xml" = "soothe/rails/evals.xml"
"src/soothe/rails/fix.xml" = "soothe/rails/fix.xml"
"src/soothe/rails/guard_system.xml" = "soothe/rails/guard_system.xml"
"src/soothe/rails/improve.xml" = "soothe/rails/improve.xml"
"src/soothe/rails/learn.xml" = "soothe/rails/learn.xml"
"src/soothe/rails/orchestrator_routing.xml" = "soothe/rails/orchestrator_routing.xml"
"src/soothe/rails/plan.xml" = "soothe/rails/plan.xml"
"src/soothe/rails/predict.xml" = "soothe/rails/predict.xml"
"src/soothe/rails/probe.xml" = "soothe/rails/probe.xml"
"src/soothe/rails/reason.xml" = "soothe/rails/reason.xml"
"src/soothe/rails/regression.xml" = "soothe/rails/regression.xml"
"src/soothe/rails/scenario.xml" = "soothe/rails/scenario.xml"
"src/soothe/rails/security.xml" = "soothe/rails/security.xml"
"src/soothe/rails/ship.xml" = "soothe/rails/ship.xml"
"src/soothe/rails/builtin_rails/autoresearch.yml" = "soothe/rails/builtin_rails/autoresearch.yml"
"src/soothe/rails/builtin_rails/feature-dev.yml" = "soothe/rails/builtin_rails/feature-dev.yml"
"src/soothe/rails/builtin_rails/greenfield-system.yml" = "soothe/rails/builtin_rails/greenfield-system.yml"
"src/soothe/rails/builtin_rails/hotfix.yml" = "soothe/rails/builtin_rails/hotfix.yml"
"src/soothe/rails/builtin_rails/maker-checker.yml" = "soothe/rails/builtin_rails/maker-checker.yml"
"src/soothe/rails/builtin_rails/pr-review.yml" = "soothe/rails/builtin_rails/pr-review.yml"
"src/soothe/rails/builtin_rails/README.md" = "soothe/rails/builtin_rails/README.md"
"src/soothe/rails/builtin_rails/spike.yml" = "soothe/rails/builtin_rails/spike.yml"

[tool.hatch.build.targets.sdist]
include = ["src/soothe/"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
[tool.ruff.format]
docstring-code-format = true

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "slow: long-running or stress tests",
]
