# Soothe production stack: PostgreSQL + pgvector + soothed daemon.
# Usage: docker compose up -d   (from config/production/)
# Env vars auto-imported via env_file from example.env.
# Pre-create ~/.soothe-prod/{data,logs,config} before first up
# (make docker-prod-up does this).

services:
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - soothe-db
    expose:
      - "5432"
    volumes:
      - soothe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  soothed:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/soothed:latest
    restart: unless-stopped
    depends_on:
      soothe-pgvector:
        condition: service_healthy
    networks:
      - soothe-db
      - soothe-app
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 223.5.5.5
    env_file:
      - ./example.env
    environment:
      SOOTHE_WORKSPACE_HOST_ROOT: ${SOOTHE_WORKSPACE_HOST_ROOT:-${HOME}}
      SOOTHE_DAEMON_SOOTHE_CONFIG_PATH: /var/lib/soothe/config/nano.yml
      SOOTHE_POSTGRES_BASE_DSN: postgresql://postgres:postgres@soothe-pgvector:5432
      SOOTHE_POSTGRES_VECTORS_DSN: postgresql://postgres:postgres@soothe-pgvector:5432/soothe_vectors
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__HOST: 0.0.0.0
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__PORT: 18765
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      # Prod workdir, isolated from dev's ~/.soothe.
      - ${HOME}/.soothe-prod:/var/lib/soothe
      - ./nano.yml:/var/lib/soothe/config/nano.yml:ro
      # Client workspaces (path translation via SOOTHE_WORKSPACE_HOST_ROOT).
      - ${SOOTHE_WORKSPACE_HOST_ROOT:-${HOME}}:/var/lib/soothe/workspaces
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/healthz', timeout=5)" || exit 1
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  soothe-db:
  soothe-app:

volumes:
  soothe_postgres_data:
