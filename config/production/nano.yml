# Soothe production agent config. Mounted at /var/lib/soothe/config/nano.yml.
# Provider credentials come from example.env via env_file in docker-compose.yml.
# Infra vars (SOOTHE_POSTGRES_*, SOOTHE_WORKSPACE_HOST_ROOT) set in docker-compose environment:.

# =============================================================================
# LLM Providers
# =============================================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5.2
      - qwen3.7-plus
      - qwen3.6-flash
      - text-embedding-v4

  - name: typesafe-official
    provider_type: typesafe
    api_base_url: "https://api.typesafe.ai"
    api_key: "${TYPESAFE_API_KEY}"
    model: jev-latest
    timeout_seconds: 5

# =============================================================================
# Model Router
# =============================================================================
router_profiles:
  - name: production
    router:
      default: "dashscope:glm-5.2"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:glm-5.2"
      image: "dashscope:qwen3.7-plus"
      ocr: null

active_router_profile: production
embedding_profile:
  model_role: dashscope:text-embedding-v4
  embedding_dims: 1536
classifier:
  enabled: true
  provider: typesafe-official

# =============================================================================
# Persistence Backend
# =============================================================================
persistence:
  default_backend: postgresql
  postgres_base_dsn: "${SOOTHE_POSTGRES_BASE_DSN}"
  postgres:
    pool_max_idle_seconds: 90
    pool_max_lifetime_seconds: 900

# =============================================================================
# Vector Stores
# =============================================================================
vector_stores:
  - name: pgvector
    provider_type: pgvector
    dsn: "${SOOTHE_POSTGRES_VECTORS_DSN}"
    pool_size: 8

vector_store_router:
  default: "pgvector:soothe_default"

# =============================================================================
# Workspace Configuration
# =============================================================================
workspace_mount:
  host_root: ${SOOTHE_WORKSPACE_HOST_ROOT}
  container_root: /var/lib/soothe/workspaces

# =============================================================================
# Security Configuration
# =============================================================================
security:
  allow_paths_outside_workspace: true
  require_approval_for_outside_paths: false
  allowed_paths:
    - "**"
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
