# Soothe nano.yml — production agent config
# PostgreSQL persistence + pgvector + DashScope OpenAI-compatible providers.
#
# Mounted at /var/lib/soothe/config/nano.yml (default agent path).
#
# Required env vars (set in deploy/.env, sourced from host shell):
#   DASHSCOPE_BASE_URL / DASHSCOPE_API_KEY  - primary DashScope credential
#   DS1..DS26_BASE_URL / DS1..DS26_API_KEY  - multi-instance DashScope credentials
#   SOOTHE_POSTGRES_BASE_DSN                - Postgres base DSN (checkpointer/sloop)
#   SOOTHE_POSTGRES_VECTORS_DSN             - pgvector DSN
#   SOOTHE_WORKSPACE_HOST_ROOT              - host workspace root (docker-compose)

# =============================================================================
# LLM Providers
# =============================================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5.2
      - qwen3.7-plus
      - qwen3.6-flash
      - kimi-k2.5
      - MiniMax-M3
      - text-embedding-v4

  # Multi-instance DashScope providers for random selection + failover.
