# =============================================================================
# Model Router
# =============================================================================
router_profiles:
  - name: glm-mm
    router:
      default: "ds1:glm-5.2;ds2:glm-5.2;ds3:glm-5.2;ds4:glm-5.2;ds5:glm-5.2;ds6:glm-5.2;ds7:glm-5.2;ds8:glm-5.2;ds9:glm-5.2;ds10:glm-5.2;ds11:glm-5.2;ds12:glm-5.2;ds13:glm-5.2;ds14:glm-5.2;ds15:glm-5.2;ds16:glm-5.2;ds17:glm-5.2;ds18:glm-5.2;ds19:glm-5.2;ds20:glm-5.2;ds21:glm-5.2;ds22:glm-5.2;ds23:glm-5.2;ds24:glm-5.2;ds25:glm-5.2;ds26:glm-5.2"
      fast: "ds1:qwen3.6-flash;ds2:qwen3.6-flash;ds3:qwen3.6-flash;ds4:qwen3.6-flash;ds5:qwen3.6-flash;ds6:qwen3.6-flash;ds7:qwen3.6-flash;ds8:qwen3.6-flash;ds9:qwen3.6-flash;ds10:qwen3.6-flash;ds11:qwen3.6-flash;ds12:qwen3.6-flash;ds13:qwen3.6-flash;ds14:qwen3.6-flash;ds15:qwen3.6-flash;ds16:qwen3.6-flash;ds17:qwen3.6-flash;ds18:qwen3.6-flash;ds19:qwen3.6-flash;ds20:qwen3.6-flash;ds21:qwen3.6-flash;ds22:qwen3.6-flash;ds23:qwen3.6-flash;ds24:qwen3.6-flash;ds25:qwen3.6-flash;ds26:qwen3.6-flash"
      think: "ds1:glm-5.2;ds2:glm-5.2;ds3:glm-5.2;ds4:glm-5.2;ds5:glm-5.2;ds6:glm-5.2;ds7:glm-5.2;ds8:glm-5.2;ds9:glm-5.2;ds10:glm-5.2;ds11:glm-5.2;ds12:glm-5.2;ds13:glm-5.2;ds14:glm-5.2;ds15:glm-5.2;ds16:glm-5.2;ds17:glm-5.2;ds18:glm-5.2;ds19:glm-5.2;ds20:glm-5.2;ds21:glm-5.2;ds22:glm-5.2;ds23:glm-5.2;ds24:glm-5.2;ds25:glm-5.2;ds26:glm-5.2"
      image: "ds1:qwen3.7-plus;ds2:qwen3.7-plus;ds3:qwen3.7-plus;ds4:qwen3.7-plus;ds5:qwen3.7-plus;ds6:qwen3.7-plus;ds7:qwen3.7-plus;ds8:qwen3.7-plus;ds9:qwen3.7-plus;ds10:qwen3.7-plus;ds11:qwen3.7-plus;ds12:qwen3.7-plus;ds13:qwen3.7-plus;ds14:qwen3.7-plus;ds15:qwen3.7-plus;ds16:qwen3.7-plus;ds17:qwen3.7-plus;ds18:qwen3.7-plus;ds19:qwen3.7-plus;ds20:qwen3.7-plus;ds21:qwen3.7-plus;ds22:qwen3.7-plus;ds23:qwen3.7-plus;ds24:qwen3.7-plus;ds25:qwen3.7-plus;ds26:qwen3.7-plus"
      ocr: null

  - name: production
    router:
      default: "dashscope:glm-5.2"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:glm-5.2"
      image: "dashscope:qwen3.7-plus"
      ocr: null

active_router_profile: production

embedding_profile:
  - model_role: dashscope:text-embedding-v4
    embedding_dims: 1536

# =============================================================================
# Persistence Backend
# =============================================================================
persistence:
  default_backend: postgresql
  postgres_base_dsn: "${SOOTHE_POSTGRES_BASE_DSN}"
  postgres:
    pool_max_idle_seconds: 90
    pool_max_lifetime_seconds: 900

# =============================================================================
# Vector Stores
# =============================================================================
vector_stores:
  - name: pgvector
    provider_type: pgvector
    dsn: "${SOOTHE_POSTGRES_VECTORS_DSN}"
    pool_size: 8

vector_store_router:
  default: "pgvector:soothe_default"

# =============================================================================
# Workspace Configuration
# =============================================================================
workspace_mount:
  host_root: ${SOOTHE_WORKSPACE_HOST_ROOT}
  container_root: /var/lib/soothe/workspaces

# =============================================================================
# Security Configuration
# =============================================================================
security:
  allow_paths_outside_workspace: true
  require_approval_for_outside_paths: false
  allowed_paths:
    - "**"
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
