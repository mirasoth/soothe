# Team develop soothe host profile (host-owned keys only).
# Compose with config/develop/nano.yml.
# Autopilot scheduling is ON by default for local long-running evals.
# Carries only dev-specific overrides; values equal to config/soothe.template.yml
# (and matching the Pydantic model default) have been stripped so that the
# template remains the single source of default values.

agent:
  final_response: always_synthesize

  autopilot:
    judge_allow_structural_dag_ops: []
    rail_auto_pick_deny: []
    notify:
      enabled: true
      suspend_escalation_multiplier: 2.0
      dedup_ttl_seconds: 86400
      targets:
        - kind: email
          to_address: "caesar0301@163.com"
      sinks:
        email:
          enabled: true
          smtp_host: smtp.qq.com
          smtp_port: 465
          # Plain string or ${ENV_VAR} (same dual rule as providers[].api_key).
          smtp_username: "${SOOTHE_SMTP_USERNAME}"
          smtp_password: "${SOOTHE_SMTP_PASSWORD}"
          smtp_use_tls: false
          smtp_use_ssl: true
          from_address: "413245279@qq.com"
          rate_limit_seconds: 5.0
          targets: []
        feishu:
          enabled: false
          # Plain string or ${ENV_VAR}.
          app_id: "${FEISHU_APP_ID}"
          app_secret: "${FEISHU_APP_SECRET}"
          targets: []
    # Develop: fewer loops than the template default (16) for faster local cycles.
    max_loops: 4

  loop:
    final_response: always_synthesize
