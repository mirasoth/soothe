agent:
  autopilot:
    judge_allow_structural_dag_ops: []
    rail_auto_pick_deny: []
    notify:
      enabled: true
      suspend_escalation_multiplier: 2.0
      dedup_ttl_seconds: 86400
      targets:
        - kind: email
          to_address: "caesar0301@163.com"
      sinks:
        email:
          enabled: true
          smtp_host: smtp.qq.com
          smtp_port: 465
          smtp_username: "${SOOTHE_SMTP_USERNAME}"
          smtp_password: "${SOOTHE_SMTP_PASSWORD}"
          smtp_use_tls: false
          smtp_use_ssl: true
          from_address: "413245279@qq.com"
          rate_limit_seconds: 5.0
          targets: []
        feishu:
          enabled: false
          app_id: "${FEISHU_APP_ID}"
          app_secret: "${FEISHU_APP_SECRET}"
          targets: []
      sla:
        enabled: false
        warning_seconds: 3600
        critical_seconds: 7200
        breach_seconds: 14400
    max_loops: 4

  loop:
    final_response: always_synthesize

cron: {}

