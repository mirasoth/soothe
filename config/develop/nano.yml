active_router_profile: glm
embedding_profile:
  - model_role: dashscope:text-embedding-v4
    embedding_dims: 1536

agent:
  middleware:
    llm_rate_limit:
      rpm_limit: 180
      concurrent_limit: 4
      global_concurrent_limit: 18

tools:
  wizsearch:
    default_engines:
      - duckduckgo
      - bing
  http_requests:
    allow_dangerous_requests: false
  deepxiv:
    token: "${DEEPXIV_API_KEY}"

persistence:
  # Unused while default_backend is sqlite; kept for a quick Postgres flip:
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"
  soothe_postgres_dsn: "${SOOTHE_POSTGRES_DSN}"
  postgres:
    pool_max_idle_seconds: 90
    pool_max_lifetime_seconds: 900

observability:
  log_file_level: DEBUG
  langfuse:
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

security:
  allow_paths_outside_workspace: true
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []

vector_stores:
  - name: sqlite_vec_dev
    provider_type: sqlite_vec
    dsn: null
    index_type: hnsw
    url: null
    api_key: null
    grpc_port: 50051

vector_store_router:
  default: sqlite_vec_dev:soothe_default
