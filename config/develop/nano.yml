# Team develop nano profile (nano-owned keys only).
# Compose with config/develop/soothe.yml for full soothe host behavior.

providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5.2
      - qwen3.7-plus
      - kimi-k2.5
      - kimi-k2.7-code
      - MiniMax-M3
      - text-embedding-v4

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - kimi-k2.5
      - MiniMax-M2.5
      - qwen3.7-plus

  - name: agnes
    provider_type: openai
    api_base_url: "https://apihub.agnes-ai.com/v1"
    api_key: "${AGNESAI_API_KEY}"
    models:
      - agnes-2.0-flash
      - agnes-2.5-flash
      - agnes-image-2.0-flash
      - agnes-image-2.1-flash

  - name: omlx
    provider_type: openai
    api_base_url: "http://100.75.70.86:9642/v1"
    api_key: "mirasoth"
    models:
      - Qwen3.6-27B-OptiQ-4bit
      - GLM-4.6V-Flash-4bit
      - PaddleOCR-VL-1.5-4bit
      - DeepSeek-OCR-4bit
      - nomicai-modernbert-embed-base-bf16

router_profiles:
  - name: production
    router:
      default: "dashscope:glm-5.2"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:glm-5.2"
      image: "dashscope:qwen3.7-plus"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"

  - name: coding-plan
    router:
      default: "coding-plan:glm-5"
      fast: "coding-plan:kimi-k2.5"
      image: "coding-plan:qwen3.7-plus"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"

  - name: production-minimax
    router:
      default: "dashscope:MiniMax-M3"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:MiniMax-M3"
      image: "dashscope:MiniMax-M3"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"

  - name: agnes-eval
    router:
      default: "agnes:agnes-2.0-flash"
      image: "agnes:agnes-image-2.0-flash"
      ocr: "omlx:DeepSeek-OCR-4bit"

  - name: local-deploy
    router:
      default: "omlx:Qwen3.6-27B-OptiQ-4bit"
      image: "omlx:GLM-4.6V-Flash-4bit"
      ocr: "omlx:DeepSeek-OCR-4bit"

active_router_profile: coding-plan

embedding_profile:
  - model_role: dashscope:text-embedding-v4
    embedding_dims: 1536

# Local develop defaults to SQLite (one process mode for the whole runtime).
# Flip to postgresql + pgvector when exercising the Postgres path against
# docker compose / PgBouncer — do not mix backends in one process.
persistence:
  default_backend: sqlite
  # Unused while default_backend is sqlite; kept for a quick Postgres flip:
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"
  postgres:
    pool_max_idle_seconds: 90
    pool_max_lifetime_seconds: 900

security:
  allow_paths_outside_workspace: true

observability:
  log_file_level: DEBUG
  langfuse:
    enabled: false
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

vector_stores:
  - name: sqlite_vec_dev
    provider_type: sqlite_vec

vector_store_router:
  default: sqlite_vec_dev:soothe_default

tools:
  wizsearch:
    default_engines:
      - duckduckgo
      - bing
