name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# GitHub-hosted runners reach PyPI directly; do not use regional mirrors here
# (mirror sync rewrites uv.lock and can force a full re-resolve).
env:
  UV_PYPI_MIRROR: https://pypi.org/simple

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        # Pin to canonical archive; Azure mirror (azure.archive.ubuntu.com) is flaky.
        # Ubuntu 24.04 uses deb822 (.sources) as well as legacy (.list) formats.
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev ripgrep silversearcher-ag
      timeout-minutes: 5

    - name: Install dependencies (workspace)
      run: uv sync --frozen --all-packages --all-extras

    - name: Verify package imports
      run: |
        uv run python -c "from soothe_sdk.protocols.core_agent import CoreAgentCapabilities; print('soothe-sdk OK')"

    - name: Run tests (daemon package)
      run: make test-unit

    - name: Alert pipeline latency SLO gate
      run: make bench-alert-slo

    # - name: Run integration tests
    #   run: make test-integration
    #   env:
    #     DASHSCOPE_CP_API_KEY: ${{ secrets.DASHSCOPE_CP_API_KEY }}
    #     DASHSCOPE_CP_BASE_URL: ${{ secrets.DASHSCOPE_CP_BASE_URL }}

    - name: Build all packages
      run: make build

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install system dependencies
      run: |
        # Pin to canonical archive; Azure mirror (azure.archive.ubuntu.com) is flaky.
        # Ubuntu 24.04 uses deb822 (.sources) as well as legacy (.list) formats.
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev
      timeout-minutes: 5

    - name: Install dependencies (workspace)
      run: uv sync --frozen --all-packages --all-extras

    - name: Lint (format + ruff check)
      run: make lint
