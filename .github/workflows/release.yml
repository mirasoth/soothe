name: Release Soothe Packages

on:
  release:
    types: [published]
  workflow_dispatch:

# Use canonical PyPI on GHA (avoid regional mirrors rewriting uv.lock).
env:
  UV_PYPI_MIRROR: https://pypi.org/simple

permissions:
  contents: read
  id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

jobs:
  # soothe-sdk is now hosted in this monorepo (packages/soothe-sdk).
  # It publishes first; downstream packages wait for it on PyPI.
  deploy-sdk:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/soothe-sdk

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Sync SDK dependencies
      run: |
        cd packages/soothe-sdk
        uv sync --all-extras

    - name: Get SDK version
      id: sdk-version
      run: |
        VERSION=$(cat packages/soothe-sdk/VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if SDK version exists on PyPI
      id: sdk-check
      run: |
        VERSION="${{ steps.sdk-version.outputs.version }}"
        echo "Checking if soothe-sdk $VERSION exists on PyPI..."
        if pip index versions soothe-sdk 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION not found on PyPI, will publish"
        fi

    - name: Run SDK tests
      if: steps.sdk-check.outputs.exists == 'false'
      run: |
        cd packages/soothe-sdk
        uv run pytest tests/ -v --ignore=tests/test_integration.py

    - name: Build SDK package
      if: steps.sdk-check.outputs.exists == 'false'
      run: |
        rm -rf dist/
        cd packages/soothe-sdk
        uv build --out-dir ../../dist

    - name: Verify SDK dist directory
      if: steps.sdk-check.outputs.exists == 'false'
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist directory not found"
          exit 1
        fi
        if [ -z "$(ls -A dist | grep soothe_sdk)" ]; then
          echo "❌ Error: dist directory doesn't contain soothe-sdk packages"
          exit 1
        fi
        echo "✓ dist directory exists and contains soothe-sdk packages"
        ls -la dist/ | grep soothe_sdk

    - name: Publish soothe-sdk to PyPI
      if: steps.sdk-check.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true

  deploy-cli:
    runs-on: ubuntu-latest
    needs: deploy-sdk
    environment:
      name: pypi
      url: https://pypi.org/p/soothe-cli

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Wait for soothe-sdk on PyPI
      run: |
        VERSION=$(cat packages/soothe-sdk/VERSION)
        for i in {1..30}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/soothe-sdk/${VERSION}/json" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ soothe-sdk ${VERSION} is available on PyPI"
            exit 0
          fi
          echo "Waiting for soothe-sdk ${VERSION} on PyPI... attempt $i/30 (HTTP ${HTTP_STATUS})"
          sleep 10
        done
        echo "❌ Timeout: soothe-sdk ${VERSION} not found on PyPI after 5 minutes"
        exit 1

    - name: Sync CLI dependencies
      run: |
        cd packages/soothe-cli
        uv sync --all-extras

    - name: Get CLI version
      id: cli-version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if CLI version exists on PyPI
      id: cli-check
      run: |
        VERSION="${{ steps.cli-version.outputs.version }}"
        echo "Checking if soothe-cli $VERSION exists on PyPI..."
        if pip index versions soothe-cli 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION not found on PyPI, will publish"
        fi

    - name: Build CLI package
      if: steps.cli-check.outputs.exists == 'false'
      run: |
        rm -rf dist/
        cd packages/soothe-cli
        uv build --out-dir ../../dist

    - name: Verify CLI dist directory
      if: steps.cli-check.outputs.exists == 'false'
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist directory not found"
          exit 1
        fi
        if [ -z "$(ls -A dist | grep soothe_cli)" ]; then
          echo "❌ Error: dist directory doesn't contain CLI packages"
          exit 1
        fi
        echo "✓ dist directory exists and contains CLI packages"
        ls -la dist/ | grep soothe_cli

    - name: Publish CLI to PyPI
      if: steps.cli-check.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true

  deploy-core:
    runs-on: ubuntu-latest
    needs: deploy-sdk
    environment:
      name: pypi
      url: https://pypi.org/p/soothe

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev ripgrep silversearcher-ag

    - name: Wait for soothe-nano on PyPI
      run: |
        # soothe-nano publishes from mirasoth/soothe-nano (independent repo).
        # Monorepo release waits for the soothe pin floor on PyPI; does not publish nano.
        VERSION=$(python - <<'PY'
        import re
        from pathlib import Path
        text = Path("packages/soothe/pyproject.toml").read_text()
        match = re.search(r'"soothe-nano>=([^,<"]+)', text)
        if not match:
            raise SystemExit("soothe-nano pin not found in packages/soothe/pyproject.toml")
        print(match.group(1))
        PY
        )
        for i in {1..30}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/soothe-nano/${VERSION}/json" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ soothe-nano ${VERSION} is available on PyPI"
            exit 0
          fi
          echo "Waiting for soothe-nano ${VERSION} on PyPI... attempt $i/30 (HTTP ${HTTP_STATUS})"
          sleep 10
        done
        echo "❌ Timeout: soothe-nano ${VERSION} not found on PyPI after 5 minutes"
        echo "Publish soothe-nano from https://github.com/mirasoth/soothe-nano first, then re-run."
        exit 1

    - name: Wait for soothe-sdk on PyPI
      run: |
        # soothe-sdk is published from this monorepo (deploy-sdk job).
        # Wait for PyPI propagation before resolving soothe's dependencies.
        VERSION=$(cat packages/soothe-sdk/VERSION)
        for i in {1..30}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/soothe-sdk/${VERSION}/json" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ soothe-sdk ${VERSION} is available on PyPI"
            exit 0
          fi
          echo "Waiting for soothe-sdk ${VERSION} on PyPI... attempt $i/30 (HTTP ${HTTP_STATUS})"
          sleep 10
        done
        echo "❌ Timeout: soothe-sdk ${VERSION} not found on PyPI after 5 minutes"
        exit 1

    - name: Sync soothe core dependencies
      run: |
        cd packages/soothe
        uv sync --all-extras

    - name: Get soothe core version
      id: core-version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if soothe core version exists on PyPI
      id: core-check
      run: |
        VERSION="${{ steps.core-version.outputs.version }}"
        echo "Checking if soothe $VERSION exists on PyPI..."
        if pip index versions soothe 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION not found on PyPI, will publish"
        fi

    - name: Run soothe core tests
      if: steps.core-check.outputs.exists == 'false'
      run: |
        cd packages/soothe
        uv run pytest tests/unit/ -v

    - name: Build soothe core package
      if: steps.core-check.outputs.exists == 'false'
      run: |
        rm -rf dist/
        cd packages/soothe
        uv build --out-dir ../../dist

    - name: Verify soothe core dist directory
      if: steps.core-check.outputs.exists == 'false'
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist directory not found"
          exit 1
        fi
        if [ -z "$(ls -A dist | grep -E 'soothe-[0-9]')" ]; then
          echo "❌ Error: dist directory doesn't contain soothe core packages"
          exit 1
        fi
        echo "✓ dist directory exists and contains soothe core packages"
        ls -la dist/ | grep -E 'soothe-[0-9]'

    - name: Publish soothe core to PyPI
      if: steps.core-check.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true

  deploy-autopilot:
    runs-on: ubuntu-latest
    needs: deploy-core
    environment:
      name: pypi
      url: https://pypi.org/p/soothe-autopilot

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Wait for soothe on PyPI
      run: |
        VERSION=$(cat VERSION)
        for i in {1..30}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/soothe/${VERSION}/json" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ soothe ${VERSION} is available on PyPI"
            exit 0
          fi
          echo "Waiting for soothe ${VERSION} on PyPI... attempt $i/30 (HTTP ${HTTP_STATUS})"
          sleep 10
        done
        echo "❌ Timeout: soothe ${VERSION} not found on PyPI after 5 minutes"
        exit 1

    - name: Sync soothe-autopilot dependencies
      run: |
        cd packages/soothe-autopilot
        uv sync --all-extras

    - name: Get soothe-autopilot version
      id: autopilot-version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if soothe-autopilot version exists on PyPI
      id: autopilot-check
      run: |
        VERSION="${{ steps.autopilot-version.outputs.version }}"
        echo "Checking if soothe-autopilot $VERSION exists on PyPI..."
        if pip index versions soothe-autopilot 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION not found on PyPI, will publish"
        fi

    - name: Run soothe-autopilot tests
      if: steps.autopilot-check.outputs.exists == 'false'
      run: |
        cd packages/soothe-autopilot
        uv run pytest tests/unit/ -v

    - name: Build soothe-autopilot package
      if: steps.autopilot-check.outputs.exists == 'false'
      run: |
        rm -rf dist/
        cd packages/soothe-autopilot
        uv build --out-dir ../../dist

    - name: Verify soothe-autopilot dist directory
      if: steps.autopilot-check.outputs.exists == 'false'
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist directory not found"
          exit 1
        fi
        if [ -z "$(ls -A dist | grep soothe_autopilot)" ]; then
          echo "❌ Error: dist directory doesn't contain soothe-autopilot packages"
          exit 1
        fi
        echo "✓ dist directory exists and contains soothe-autopilot packages"
        ls -la dist/ | grep soothe_autopilot

    - name: Publish soothe-autopilot to PyPI
      if: steps.autopilot-check.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true

  deploy-daemon:
    runs-on: ubuntu-latest
    needs: [deploy-core, deploy-autopilot]
    environment:
      name: pypi
      url: https://pypi.org/p/soothe-daemon

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Wait for soothe and soothe-autopilot on PyPI
      run: |
        VERSION=$(cat VERSION)
        for pkg in soothe soothe-autopilot; do
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://pypi.org/pypi/${pkg}/${VERSION}/json" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ ${pkg} ${VERSION} is available on PyPI"
              break
            fi
            echo "Waiting for ${pkg} ${VERSION} on PyPI... attempt $i/30 (HTTP ${HTTP_STATUS})"
            sleep 10
            if [ "$i" = "30" ]; then
              echo "❌ Timeout: ${pkg} ${VERSION} not found on PyPI after 5 minutes"
              exit 1
            fi
          done
        done

    - name: Sync soothe-daemon dependencies
      run: |
        cd packages/soothe-daemon
        uv sync --all-extras

    - name: Get soothe-daemon version
      id: daemon-version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if soothe-daemon version exists on PyPI
      id: daemon-check
      run: |
        VERSION="${{ steps.daemon-version.outputs.version }}"
        echo "Checking if soothe-daemon $VERSION exists on PyPI..."
        if pip index versions soothe-daemon 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION not found on PyPI, will publish"
        fi

    - name: Run soothe-daemon tests
      if: steps.daemon-check.outputs.exists == 'false'
      run: |
        cd packages/soothe-daemon
        uv run pytest tests/unit/ -v

    - name: Build soothe-daemon package
      if: steps.daemon-check.outputs.exists == 'false'
      run: |
        rm -rf dist/
        cd packages/soothe-daemon
        uv build --out-dir ../../dist

    - name: Verify soothe-daemon dist directory
      if: steps.daemon-check.outputs.exists == 'false'
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Error: dist directory not found"
          exit 1
        fi
        if [ -z "$(ls -A dist | grep soothe_daemon)" ]; then
          echo "❌ Error: dist directory doesn't contain soothe-daemon packages"
          exit 1
        fi
        echo "✓ dist directory exists and contains soothe-daemon packages"
        ls -la dist/ | grep soothe_daemon

    - name: Publish soothe-daemon to PyPI
      if: steps.daemon-check.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verbose: true
        print-hash: true
