name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Sync TS client API docs
        run: |
          cd client/typescript
          npm ci
          npm run docs:api:all
          cd ../..
          node scripts/sync-ts-api-docs.mjs

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build -s docs -d _site
          touch _site/.nojekyll

      - name: Verify build output
        run: |
          test -f _site/index.html
          test -f _site/wiki/index.html
          test -f _site/faq/index.html
          test -f _site/changelog/index.html
          test -f _site/wiki/api-reference/index.html
          test -f _site/wiki/api-reference/ts-client/index.html
          test -f _site/changelogs/index.html
          test -f _site/.nojekyll
          test ! -e _site/specs
          test ! -e _site/drafts
          echo "Pages artifact verification passed ($(du -sh _site | cut -f1))"
          # Top-level nav pages must appear as siblings of Wiki (not nested under it)
          python3 - <<'PY'
          from pathlib import Path
          html = Path("_site/index.html").read_text()
          for label in ("Home", "Wiki", "FAQ", "CHANGELOG", "Versioned Changelogs", "API Reference"):
              assert label in html, f"missing nav label: {label}"
          print("Nav labels present on Home")
          # Verify the changelogs landing page renders with nav frontmatter.
          cl = Path("_site/changelogs/index.html").read_text()
          assert "Versioned Changelogs" in cl, "changelogs index missing title"
          print("Versioned changelogs landing page present")
          PY

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          single-commit: true
          commit-message: "deploy: GitHub Pages from ${{ github.sha }}"
