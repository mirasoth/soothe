asyncapi: 3.0.0
info:
  title: Soothe Daemon WebSocket API
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol for daemon communication.
    Hybrid RPC + streaming subscription model.

    Protocol version 1 — see RFC-450 for design rationale.

    Display card ledger frames (UI source of truth) arrive as `event` /
    `mode=custom` with `data.type` in
    `soothe.card.created` | `soothe.card.updated` | `soothe.card.finalized` |
    `soothe.card.replay.begin` | `soothe.card.replay.end` (RFC-413). Legacy bare
    `card.*` names are not accepted.

servers:
  daemon:
    host: 127.0.0.1:8765
    pathname: /
    protocol: ws
    protocolVersion: '1'
    description: Local daemon WebSocket endpoint

channels:
  main:
    address: /
    title: Main bidirectional channel
    bindings:
      ws:
        method: GET
    operations:
      send:
        action: send
        title: Server-to-client messages
        channel:
          $ref: '#/channels/main'
        messages:
          - $ref: '#/components/messages/connectionAck'
          - $ref: '#/components/messages/response'
          - $ref: '#/components/messages/next'
          - $ref: '#/components/messages/error'
          - $ref: '#/components/messages/complete'
          - $ref: '#/components/messages/receiptResponse'
          - $ref: '#/components/messages/pong'
          - $ref: '#/components/messages/status'
      receive:
        action: receive
        title: Client-to-server messages
        channel:
          $ref: '#/channels/main'
        messages:
          - $ref: '#/components/messages/connectionInit'
          # Loop RPC requests
          - $ref: '#/components/messages/loopListRequest'
          - $ref: '#/components/messages/loopGetRequest'
          - $ref: '#/components/messages/loopTreeRequest'
          - $ref: '#/components/messages/loopPruneRequest'
          - $ref: '#/components/messages/loopDeleteRequest'
          - $ref: '#/components/messages/loopNewRequest'
          - $ref: '#/components/messages/loopReattachRequest'
          - $ref: '#/components/messages/loopDetachRequest'
          - $ref: '#/components/messages/loopInputRequest'
          - $ref: '#/components/messages/loopMessagesRequest'
          - $ref: '#/components/messages/loopStateGetRequest'
          - $ref: '#/components/messages/loopStateUpdateRequest'
          - $ref: '#/components/messages/loopExecutionStateFetchRequest'
          - $ref: '#/components/messages/loopHistoryFetchRequest'
          # Job RPC requests
          - $ref: '#/components/messages/jobCreateRequest'
          - $ref: '#/components/messages/jobStatusRequest'
          - $ref: '#/components/messages/jobPauseRequest'
          - $ref: '#/components/messages/jobResumeRequest'
          - $ref: '#/components/messages/jobCancelRequest'
          - $ref: '#/components/messages/jobDagRequest'
          - $ref: '#/components/messages/jobGuidanceRequest'
          # Cron RPC requests
          - $ref: '#/components/messages/cronAddRequest'
          - $ref: '#/components/messages/cronListRequest'
          - $ref: '#/components/messages/cronShowRequest'
          - $ref: '#/components/messages/cronCancelRequest'
          # Daemon & config requests
          - $ref: '#/components/messages/daemonStatusRequest'
          - $ref: '#/components/messages/daemonShutdownRequest'
          - $ref: '#/components/messages/configGetRequest'
          - $ref: '#/components/messages/configReloadRequest'
          # Skills & models requests
          - $ref: '#/components/messages/skillsListRequest'
          - $ref: '#/components/messages/modelsListRequest'
          - $ref: '#/components/messages/invokeSkillRequest'
          - $ref: '#/components/messages/mcpStatusRequest'
          # Auth requests
          - $ref: '#/components/messages/authRequest'
          - $ref: '#/components/messages/authRefreshRequest'
          - $ref: '#/components/messages/rpcCommandRequest'
          # Autopilot RPC requests
          - $ref: '#/components/messages/autopilotStatusRequest'
          - $ref: '#/components/messages/autopilotSubmitRequest'
          - $ref: '#/components/messages/autopilotListGoalsRequest'
          - $ref: '#/components/messages/autopilotGetGoalRequest'
          - $ref: '#/components/messages/autopilotCancelGoalRequest'
          - $ref: '#/components/messages/autopilotCancelAllRequest'
          - $ref: '#/components/messages/autopilotWakeRequest'
          - $ref: '#/components/messages/autopilotDreamRequest'
          - $ref: '#/components/messages/autopilotResumeRequest'
          - $ref: '#/components/messages/autopilotListJobsRequest'
          - $ref: '#/components/messages/autopilotGetJobRequest'
          - $ref: '#/components/messages/autopilotTopRequest'
          # Notifications
          - $ref: '#/components/messages/loopInputNotification'
          - $ref: '#/components/messages/slashCommandNotification'
          - $ref: '#/components/messages/disconnectNotification'
          - $ref: '#/components/messages/deliveryAckNotification'
          # Subscriptions
          - $ref: '#/components/messages/loopEventsSubscribe'
          - $ref: '#/components/messages/autopilotEventsSubscribe'
          # Control messages
          - $ref: '#/components/messages/unsubscribe'
          - $ref: '#/components/messages/ping'

components:
  correlationIds:
    operationId:
      location: $message.payload#/id
      description: Operation correlation ID

  schemas:
    # Base envelope schemas
    baseEnvelope:
      type: object
      required: [proto, type]
      properties:
        proto:
          type: string
          const: "1"
          description: Protocol version string
        type:
          type: string
          description: Message class (request, response, notification, etc.)

    # Connection handshake schemas
    connectionInitParams:
      type: object
      properties:
        client_version:
          type: string
          description: Client software version
        client_name:
          type: string
          description: Optional client identifier
        accept_proto:
          type: array
          items:
            type: string
          default: ["1"]
          description: Protocol versions the client supports
        capabilities:
          type: array
          items:
            type: string
          description: Client-declared capabilities

    connectionAckResult:
      type: object
      properties:
        server_version:
          type: string
          description: Server software version
        protocol_version:
          type: string
          default: "1"
          description: Negotiated protocol version
        capabilities:
          type: array
          items:
            type: string
          description: Server-declared capabilities
        readiness_state:
          type: string
          enum: [ready, starting, warming, incompatible, error]
          default: ready
          description: Daemon readiness state
        heartbeat_interval_ms:
          type: integer
          default: 30000
          description: Heartbeat interval in milliseconds

    # Error schema
    errorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: Numeric error code (see RFC-450 §7.3 registry)
        message:
          type: string
          description: Human-readable error summary
        data:
          type: object
          description: Optional machine-parseable details

    # Loop RPC params
    loopGetParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        verbose:
          type: boolean
          default: false
          description: Include verbose details
        tree:
          type: boolean
          default: false
          description: Include checkpoint tree

    loopListParams:
      type: object
      properties:
        status:
          type: string
          description: Filter by loop status
        limit:
          type: integer
          description: Maximum number of results

    loopNewParams:
      type: object
      properties:
        workspace:
          type: string
          description: Optional client workspace path
        user_id:
          type: string
          description: Optional user identifier
        is_ephemeral:
          type: boolean
          default: false
          description: Create ephemeral loop

    loopInputParams:
      type: object
      required: [loop_id, content]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        content:
          oneOf:
            - type: string
            - type: object
          description: User input text or structured content
        autonomous:
          type: boolean
          default: false
          description: Enable autonomous mode
        max_iterations:
          type: integer
          exclusiveMinimum: 0
          description: Maximum iterations for autonomous mode
        model:
          type: string
          description: Optional model override
        model_params:
          type: object
          description: Optional model parameters

    subscribeParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop to subscribe to
        stream_delivery:
          type: string
          enum: [batch, adaptive, streaming]
          default: adaptive
          description: Stream delivery mode
        wire_tier:
          type: string
          enum: [full, compact]
          default: full
          description: Wire filter tier

    # Loop management params (RFC-450 §9.2)
    loopTreeParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier

    loopPruneParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        keep_latest:
          type: integer
          minimum: 1
          default: 1
          description: Number of recent branches to keep

    loopDeleteParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier

    loopReattachParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop to reattach

    loopDetachParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop to detach from

    loopMessagesParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        limit:
          type: integer
          minimum: 1
          default: 100
          description: Maximum messages to return
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset
        include_events:
          type: boolean
          default: false
          description: Include tool events in response

    loopStateGetParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        keys:
          type: array
          items:
            type: string
          description: Specific channel keys to fetch

    loopStateUpdateParams:
      type: object
      required: [loop_id, values]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier
        values:
          type: object
          description: Channel values to apply
        as_node:
          type: string
          description: Node to apply update as

    loopExecutionStateFetchParams:
      type: object
      required: [loop_id]
      description: >-
        Params for loop_execution_state_fetch. Returns a focused
        execution-progress snapshot (plan, step_index, iteration, status).
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier

    loopHistoryFetchParams:
      type: object
      required: [loop_id]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop identifier

    configReloadParams:
      type: object
      description: No required fields

    # Job RPC params (RFC-450 §9.2)
    jobCreateParams:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
          minLength: 1
          description: Root goal description
        workspace:
          type: string
          description: Optional workspace path
        user_id:
          type: string
          description: Optional user identifier
        autonomous:
          type: boolean
          default: false
          description: Enable autonomous mode
        max_iterations:
          type: integer
          exclusiveMinimum: 0
          description: Max iterations limit
        guidance:
          type: string
          description: Initial guidance text
        intent_hint:
          type: string
          description: Intent hint for execution

    jobStatusParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Job identifier

    jobPauseParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Job to pause

    jobResumeParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Job to resume

    jobCancelParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Job to cancel

    jobDagParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Job identifier

    jobGuidanceParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Target job
        content:
          type: string
          minLength: 1
          description: Guidance text (canonical field)
        goal_id:
          type: string
          description: Optional specific goal target

    # Cron RPC params (RFC-229)
    cronAddParams:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Natural language scheduling request
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: Optional job priority

    cronListParams:
      type: object
      properties:
        status:
          type: string
          description: Optional status filter

    cronShowParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Cron job identifier

    cronCancelParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Cron job to cancel

    # Daemon & config params (RFC-450 §9.2)
    daemonStatusParams:
      type: object
      description: No required fields

    daemonShutdownParams:
      type: object
      description: No required fields

    configGetParams:
      type: object
      properties:
        section:
          type: string
          description: Config section to fetch

    # Skills & models params (RFC-450 §9.2)
    skillsListParams:
      type: object
      description: No required fields

    modelsListParams:
      type: object
      description: No required fields

    invokeSkillParams:
      type: object
      required: [skill]
      properties:
        skill:
          type: string
          minLength: 1
          description: Skill name to invoke
        args:
          type: string
          default: ""
          description: Skill arguments
        clarification_mode:
          type: string
          enum: [auto, manual]
          description: Clarification handling mode

    mcpStatusParams:
      type: object
      description: No required fields

    # Auth params (RFC-450 §9.2)
    authParams:
      type: object
      properties:
        access_key:
          type: string
          description: Access key credential
        secret_key:
          type: string
          description: Secret key credential

    authRefreshParams:
      type: object
      properties:
        refresh_token:
          type: string
          description: Token to refresh

    # Command params (RFC-450 §9.4)
    slashCommandParams:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: string
          minLength: 1
          description: Slash command string (e.g. /exit, /cancel)

    rpcCommandParams:
      type: object
      properties:
        command:
          type: string
          description: RPC command name
        payload:
          type: object
          description: Command payload

    # Autopilot subscription params
    autopilotSubscribeParams:
      type: object
      properties:
        job_id:
          type: string
          description: Optional job filter
        filters:
          type: object
          description: Event filter criteria

    # Autopilot RPC params (protocol-1 request methods)
    autopilotStatusParams:
      type: object
      description: No required fields

    autopilotSubmitParams:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          description: Autopilot task description
        priority:
          type: integer
          default: 50
          description: Task priority
        workspace:
          type: string
          description: Optional workspace path

    autopilotListGoalsParams:
      type: object
      description: No required fields

    autopilotGetGoalParams:
      type: object
      required: [goal_id]
      properties:
        goal_id:
          type: string
          minLength: 1
          description: Goal identifier

    autopilotCancelGoalParams:
      type: object
      required: [goal_id]
      properties:
        goal_id:
          type: string
          minLength: 1
          description: Goal to cancel

    autopilotCancelAllParams:
      type: object
      description: No required fields

    autopilotWakeParams:
      type: object
      description: No required fields

    autopilotDreamParams:
      type: object
      description: No required fields

    autopilotResumeParams:
      type: object
      required: [goal_id]
      properties:
        goal_id:
          type: string
          minLength: 1
          description: Goal to resume

    autopilotListJobsParams:
      type: object
      description: No required fields

    autopilotGetJobParams:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Root goal (job) identifier

    autopilotTopParams:
      type: object
      description: >
        Optional filter flags for the CLI live top snapshot (IG-679 / IG-688).
      properties:
        include_terminal:
          type: boolean
          default: false
          description: >
            When true, include completed/failed/cancelled goals and fully
            terminal jobs. Default is active-only (non-terminal goals).

    # Disconnect params
    disconnectParams:
      type: object
      description: No required fields

    # Delivery ack params (IG-556 stream termination drain)
    deliveryAckParams:
      type: object
      required: [loop_id, seq]
      properties:
        loop_id:
          type: string
          minLength: 1
          description: Loop whose terminal frames were applied
        seq:
          type: integer
          minimum: 0
          description: Monotonic delivery sequence acked by the client

    # Stream event payload
    streamEventPayload:
      type: object
      properties:
        namespace:
          type: array
          items:
            type: string
          description: Event namespace path
        mode:
          type: string
          description: Event mode (messages, custom, etc.)
        data:
          type: object
          description: Event data payload

    # Status message
    statusPayload:
      type: object
      properties:
        state:
          type: string
          enum: [idle, running, stopped, detached]
          description: Daemon or loop state
        input_history:
          type: array
          items:
            type: object
          description: Optional input history

  messages:
    # Connection handshake messages
    connectionInit:
      title: Connection initialization
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: connection_init
              params:
                $ref: '#/components/schemas/connectionInitParams'

    connectionAck:
      title: Connection acknowledgment
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: connection_ack
              result:
                $ref: '#/components/schemas/connectionAckResult'

    # Heartbeat messages
    ping:
      title: Heartbeat ping
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: ping

    pong:
      title: Heartbeat response
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: pong

    # Loop RPC request messages (method-specific schemas per RFC-450 §11.2)
    loopListRequest:
      title: List loops
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_list
              params:
                $ref: '#/components/schemas/loopListParams'
              id:
                type: string

    loopGetRequest:
      title: Get loop details
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_get
              params:
                $ref: '#/components/schemas/loopGetParams'
              id:
                type: string

    loopTreeRequest:
      title: Get checkpoint tree
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_tree
              params:
                $ref: '#/components/schemas/loopTreeParams'
              id:
                type: string

    loopPruneRequest:
      title: Prune loop branches
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_prune
              params:
                $ref: '#/components/schemas/loopPruneParams'
              id:
                type: string

    loopDeleteRequest:
      title: Delete loop
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_delete
              params:
                $ref: '#/components/schemas/loopDeleteParams'
              id:
                type: string

    loopNewRequest:
      title: Create new loop
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_new
              params:
                $ref: '#/components/schemas/loopNewParams'
              id:
                type: string

    loopReattachRequest:
      title: Reattach to loop
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_reattach
              params:
                $ref: '#/components/schemas/loopReattachParams'
              id:
                type: string

    loopDetachRequest:
      title: Detach from loop
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_detach
              params:
                $ref: '#/components/schemas/loopDetachParams'
              id:
                type: string

    loopInputRequest:
      title: Submit user input (request mode)
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_input
              params:
                $ref: '#/components/schemas/loopInputParams'
              id:
                type: string

    loopMessagesRequest:
      title: Fetch persisted messages
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_messages
              params:
                $ref: '#/components/schemas/loopMessagesParams'
              id:
                type: string

    loopStateGetRequest:
      title: Get checkpoint state
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_state_get
              params:
                $ref: '#/components/schemas/loopStateGetParams'
              id:
                type: string

    loopStateUpdateRequest:
      title: Update checkpoint state
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_state_update
              params:
                $ref: '#/components/schemas/loopStateUpdateParams'
              id:
                type: string

    loopExecutionStateFetchRequest:
      title: Fetch focused execution-progress snapshot
      correlationId:
        $ref: '#/components/correlationIds/operationId'
      payload:
        allOf:
          - $ref: '#/components/schemas/baseEnvelope'
          - type: object
            properties:
              type:
                const: request
              method:
                const: loop_execution_state_fetch
              params:
                $ref: '#/components/schemas/loopExecutionStateFetchParams'
              id:
                type: string

    loopHistoryFetchRequest:
      title: Fetch goal display snapshots and live card tail
      correlationId:
        $ref: '#/components/correlationIds/operationId'
