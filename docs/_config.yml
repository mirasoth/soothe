# GitHub Pages / Jekyll configuration for Soothe documentation
#
# Publishes docs/ as the user-facing site at:
# https://mirasoth.github.io/soothe/
#
# Top-level nav: Home, Wiki, FAQ, CHANGELOG, Versioned Changelogs, API Reference
# Wiki remains the knowledge-base hub for guides and architecture.
# CHANGELOG page is generated from repository root CHANGELOG.md
# (scripts/sync_wiki_changelog.sh) during the Pages build.

title: Soothe Docs
description: >-
  Goal-driven orchestration framework for building 24/7 long-running
  autonomous agents.
url: "https://mirasoth.github.io"
baseurl: "/soothe"

repository: mirasoth/soothe
remote_theme: just-the-docs/just-the-docs@v0.10.2

# Enable auxiliary_links in the top-right navigation
aux_links:
  "GitHub": "https://github.com/mirasoth/soothe"
  "PyPI": "https://pypi.org/project/soothe/"

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Mermaid diagrams (used in architecture pages)
mermaid:
  version: "10.4.0"

# Exclude internal-only directories from the published site
exclude:
  - "specs/"
  - "impl/"
  - "drafts/"
  - "archive/"
  - "analysis/"
  - "configuration/"
  - "diagrams/"
  - "agent-skill-spec.md"
  - "wiki/archive/"
  - "wiki/WIKI-ARCHITECTURE.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"

# Callouts / collapsible sections (Just the Docs features)
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  highlight:
    title: Highlight
    color: yellow

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "wiki/getting-started"
    values:
      parent: Getting Started
  - scope:
      path: "wiki/architecture"
    values:
      parent: Architecture
  - scope:
      path: "wiki/core"
    values:
      parent: Core Modules
  - scope:
      path: "wiki/configuration-guide"
    values:
      parent: Configuration Guide
  - scope:
      path: "wiki/backends"
    values:
      parent: Backends
  - scope:
      path: "wiki/capabilities"
    values:
      parent: Capabilities
  - scope:
      path: "wiki/protocols"
    values:
      parent: Protocols
  - scope:
      path: "wiki/deployment"
    values:
      parent: Deployment
  - scope:
      path: "wiki/user-guides"
    values:
      parent: User Guides
  - scope:
      path: "wiki/troubleshooting"
    values:
      parent: Troubleshooting & Debugging
  - scope:
      path: "wiki/development"
    values:
      parent: Development & Contributing
  - scope:
      path: "wiki/api-reference/ts-client"
    values:
      parent: TS Client API
  # API Reference children declare `parent: API Reference` in frontmatter.
  # Do not set a path-wide parent default — that would nest the section index under itself.
